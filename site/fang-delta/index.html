    const lowerPart = pos.y <= 2.15 || /column|sill|back-wall|side-wall|inner-wall|counter/.test(mesh.name || "");
    const shop = findNearestDestructibleShop(game.arena?.group, pos.x, pos.z);
    if (shop && lowerPart) shop.baseHits += 1;

    spawnBrickDebris(game, T, pos, lowerPart ? 16 : 10, Math.max(0.2, Math.min(0.9, Math.max(size.x, size.z) / 5)), blastPoint);
    removeShopCollidersNear(game.arena, pos.x, pos.z, Math.max(1.2, Math.min(4.2, Math.max(size.x, size.z) * 0.55)));
    game.arena.meshes = (game.arena.meshes || []).filter((entry) => entry !== mesh);
    mesh.parent.remove(mesh);
    mesh.geometry?.dispose?.();
  }

  function collapseShop(game, T, shop, blastPoint) {
    if (!shop || shop.collapsed) return;
    shop.collapsed = true;
    const root = game.arena?.group;
    if (!root) return;
    const parts = [];
    root.traverse((child) => {
      if (!child.isMesh || child.__realismDestroyed) return;
      const name = String(child.name || "");
      if (!isUpperShopPartName(name)) return;
      const distance = Math.hypot((child.position?.x || 0) - shop.x, (child.position?.z || 0) - shop.z);
      if (distance <= 6.4) parts.push(child);
    });
    for (const mesh of parts) {
      mesh.__realismDestroyed = true;
      const pos = mesh.position.clone ? mesh.position.clone() : new T.Vector3(mesh.position.x || 0, mesh.position.y || 0, mesh.position.z || 0);
      spawnBrickDebris(game, T, pos, 14, 0.75, blastPoint || pos, true);
      game.arena.meshes = (game.arena.meshes || []).filter((entry) => entry !== mesh);
      mesh.parent?.remove(mesh);
      mesh.geometry?.dispose?.();
    }
    removeShopCollidersNear(game.arena, shop.x, shop.z, 6.8);
    setGameMessage(game, "房屋下部被炸毁，上部结构坍塌");
  }

  function isUpperShopPartName(name) {
    return /roof|ceiling|upper-wall|awning|sign|window|frame|lit-panel|shelf-goods|doorway|door-frame/.test(name);
  }

  function spawnBrickDebris(game, T, center, count, scale = 0.5, blastPoint = center, heavy = false) {
    if (!game?.scene) return;
    const mats = game.__realismMats;
    game.__realismFallingDebris = game.__realismFallingDebris || [];
    for (let i = 0; i < count; i += 1) {
      const w = (0.16 + Math.random() * 0.34) * scale;
      const h = (0.12 + Math.random() * 0.24) * scale;
      const d = (0.18 + Math.random() * 0.36) * scale;
      const x = center.x + (Math.random() - 0.5) * (heavy ? 2.4 : 1.4);
      const y = Math.max(0.35, center.y + (Math.random() - 0.35) * 1.2);
      const z = center.z + (Math.random() - 0.5) * (heavy ? 2.4 : 1.4);
      const mat = Math.random() > 0.22 ? mats.brick : mats.concrete;
      const brick = addBox(game.scene, T, x, y, z, w, h, d, mat, "falling-brick-debris");
      const awayX = x - (blastPoint?.x || center.x);
      const awayZ = z - (blastPoint?.z || center.z);
      const len = Math.hypot(awayX, awayZ) || 1;
      const outward = heavy ? 1.4 : 3.4;
      const velocity = new T.Vector3(
        (awayX / len) * outward + (Math.random() - 0.5) * 2.2,
        heavy ? -0.8 - Math.random() * 1.8 : 2.2 + Math.random() * 4.2,
        (awayZ / len) * outward + (Math.random() - 0.5) * 2.2
      );
      game.__realismFallingDebris.push({
        mesh: brick,
        velocity,
        spin: new T.Vector3(Math.random() * 5, Math.random() * 5, Math.random() * 5),
        life: heavy ? 6.5 : 5.2,
        damage: heavy ? 12 : 7,
        damageDone: false
      });
    }
  }

  function updateFallingDebris(game, T) {
    const debris = game.__realismFallingDebris || [];
    if (!debris.length) return;
    const now = performance.now() / 1000;
    const last = Number(game.__realismDebrisLastAt || now);
    const dt = Math.max(0.001, Math.min(0.05, now - last || 0.016));
    game.__realismDebrisLastAt = now;
    const playerPosition = getPlayerWorldPosition(game, T);
    const keep = [];
    for (const piece of debris) {
      const mesh = piece.mesh;
      if (!mesh?.parent) continue;
      piece.life -= dt;
      piece.velocity.y -= 9.6 * dt;
      mesh.position.addScaledVector(piece.velocity, dt);
      mesh.rotation.x += piece.spin.x * dt;
      mesh.rotation.y += piece.spin.y * dt;
      mesh.rotation.z += piece.spin.z * dt;
      if (mesh.position.y <= 0.08) {
        mesh.position.y = 0.08;
        piece.velocity.y = Math.abs(piece.velocity.y) * 0.16;
        piece.velocity.x *= 0.52;
        piece.velocity.z *= 0.52;
        piece.spin.multiplyScalar(0.72);
      }
      if (!piece.damageDone && playerPosition && distance3(playerPosition, mesh.position) <= 0.82 && Math.abs(piece.velocity.y) > 1.15) {
        piece.damageDone = true;
        applyDirectPlayerDamage(game, piece.damage, "坠落砖块");
      }
      if (piece.life > 0) keep.push(piece);
      else {
        mesh.parent.remove(mesh);
        mesh.geometry?.dispose?.();
      }
    }
    game.__realismFallingDebris = keep;
  }

  function updateBridgeWaterHazard(game, T) {
    const river = game?.arena?.group?.__realismBridgeRiver;
    if (getSelectedMap().id !== "bridge" || !river || game.session?.screen !== "playing" || game.session?.playerAlive === false) {
      resetBridgeWaterHazard(game);
      return;
    }
    const playerPosition = game?.player?.getPosition?.() || game?.camera?.position;
    if (!playerPosition) return;
    const inRiverBounds =
      playerPosition.x >= river.minX &&
      playerPosition.x <= river.maxX &&
      playerPosition.z >= river.minZ &&
      playerPosition.z <= river.maxZ;
    const onBridgeDeck = Math.abs(playerPosition.x || 0) <= (river.safeBridgeHalfWidth || 2.55) || (playerPosition.y || 0) > 0.58;
    const inWater = inRiverBounds && !onBridgeDeck;
    if (!inWater) {
      if (game.__realismBridgeWaterStartedAt) setGameMessage(game, "已离开河水");
      resetBridgeWaterHazard(game);
      return;
    }

    const now = Number(game.now || Date.now() / 1000);
    const deathSeconds = Number(river.deathSeconds || 10);
    if (!game.__realismBridgeWaterStartedAt) {
      game.__realismBridgeWaterStartedAt = now;
      game.__realismBridgeWaterLastSecond = deathSeconds;
      setGameMessage(game, `落入河中：${deathSeconds} 秒后死亡`);
      return;
    }
    const remaining = Math.max(0, deathSeconds - (now - game.__realismBridgeWaterStartedAt));
    const wholeSecond = Math.ceil(remaining);
    if (wholeSecond !== game.__realismBridgeWaterLastSecond) {
      game.__realismBridgeWaterLastSecond = wholeSecond;
      setGameMessage(game, wholeSecond > 0 ? `落入河中：${wholeSecond} 秒后死亡` : "落水死亡");
    }
    if (remaining <= 0) {
      resetBridgeWaterHazard(game);
      failRaidFromDeath(game, now);
    }
  }

  function resetBridgeWaterHazard(game) {
    if (!game) return;
    game.__realismBridgeWaterStartedAt = 0;
    game.__realismBridgeWaterLastSecond = 0;
  }

  function getBridgeWaterRemainingSeconds(game) {
    const river = game?.arena?.group?.__realismBridgeRiver;
    if (!river || !game.__realismBridgeWaterStartedAt) return 0;
    const now = Number(game.now || Date.now() / 1000);
    return Math.max(0, Math.ceil(Number(river.deathSeconds || 10) - (now - game.__realismBridgeWaterStartedAt)));
  }

  function removeShopCollidersNear(arena, x, z, radius) {
    if (!arena?.colliders) return;
    arena.colliders = arena.colliders.filter((collider) => {
      if (!/street-shop|shop-|door|window/.test(String(collider.name || ""))) return true;
      const centerX = (collider.minX + collider.maxX) / 2;
      const centerZ = (collider.minZ + collider.maxZ) / 2;
      return Math.hypot(centerX - x, centerZ - z) > radius;
    });
  }

  function findNearestDestructibleShop(root, x, z) {
    let best = null;
    let bestDistance = Infinity;
    for (const shop of root?.__realismDestructibleBuildings || []) {
      const distance = Math.hypot(shop.x - x, shop.z - z);
      if (distance < bestDistance) {
        best = shop;
        bestDistance = distance;
      }
    }
    return bestDistance <= 6.6 ? best : null;
  }

  function getBoxMeshSize(mesh) {
    const params = mesh.geometry?.parameters || {};
    return {
      x: Math.max(0.1, (params.width || params.radiusTop * 2 || params.radius * 2 || 0.4) * (mesh.scale?.x || 1)),
      y: Math.max(0.1, (params.height || 0.4) * (mesh.scale?.y || 1)),
      z: Math.max(0.1, (params.depth || params.radiusTop * 2 || params.radius * 2 || 0.4) * (mesh.scale?.z || 1))
    };
  }

  function getPlayerWorldPosition(game, T) {
    const position = game?.player?.getPosition?.() || game?.camera?.position;
    if (!position) return null;
    return new T.Vector3(position.x || 0, (position.y || 0) + 0.95, position.z || 0);
  }

  function getEnemyWorldPosition(record) {
    return record?.enemy?.position || record?.view?.root?.position || null;
  }

  function distance3(a, b) {
    return Math.hypot((a.x || 0) - (b.x || 0), (a.y || 0) - (b.y || 0), (a.z || 0) - (b.z || 0));
  }

  function sendLanFlash(game, targetId, point, duration = 3) {
    if (!targetId || game.selectedMode !== "lan" || !game.lanClient?.joined) return;
    const roomId = game.__realismLanRoomId || game.lanClient.roomId || "delta-lan";
    const playerId = game.lanClient.playerId;
    fetch("/api/lan/flash", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        roomId,
        playerId,
        targetId,
        duration,
        origin: { x: point.x || 0, y: point.y || 0, z: point.z || 0 }
      })
    }).catch(() => setGameMessage(game, "闪光弹同步失败"));
  }

  function patchLanFlashEvents(game) {
    if (!game || game.__realismLanFlashEventsPatched || typeof game.applyLanEvents !== "function") return;
    const original = game.applyLanEvents.bind(game);
    game.applyLanEvents = (events = []) => {
      for (const event of events || []) {
        if (event?.type !== "flash") continue;
        if (event.targetId === game.lanClient?.playerId) {
          triggerFlashOverlay(game, event.duration || 3);
          setGameMessage(game, "被闪光弹命中，白屏 3 秒");
        }
        const source = event.playerId ? (game.enemyRecords || []).find((record) => record.enemy?.id === event.playerId) : null;
        if (source) source.enemy = { ...source.enemy, firingFlash: 1 };
      }
      return original(events);
    };
    game.__realismLanFlashEventsPatched = true;
  }

  function applyConsumableEffects(game) {
    const state = getEconomyState();
    const swiftRemaining = getSwiftRemainingSeconds(state);
    if (game.roleState) {
      const base = game.roleState.shieldActive ? 0.62 : 1;
      if (swiftRemaining > 0) {
        game.roleState.speedMultiplier = Math.round(base * 1.2 * 100) / 100;
        game.__realismSwiftBoostActive = true;
      } else if (game.__realismSwiftBoostActive) {
        game.roleState.speedMultiplier = base;
        game.__realismSwiftBoostActive = false;
      }
    }
    if (swiftRemaining <= 0 && state.active?.swiftUntilMs) {
      state.active.swiftUntilMs = 0;
      saveEconomyState(state);
      markDeltaUiDirty();
    }
  }

  function syncPurchasedAmmoUsage(game) {
    if (!game?.weapon || game.session?.screen !== "playing") {
      game.__realismAmmoWatch = null;
      return;
    }
    const currentAmmo = Number(game.weapon.ammo || 0);
    const weaponKey = `${game.weapon.type || ""}:${game.weapon.label || ""}`;
    const watch = game.__realismAmmoWatch;
    if (watch && watch.weaponKey === weaponKey && !game.weapon.reloading && currentAmmo < watch.ammo) {
      const used = Math.max(0, Math.round(watch.ammo - currentAmmo));
      applyWeaponRecoilKick(game, used);
      consumeEquippedAmmo(game, used);
    }
    game.__realismAmmoWatch = { weaponKey, ammo: currentAmmo };
  }

  function applyWeaponAttachmentStats(game) {
    if (!game?.weapon) return;
    const handling = calculateWeaponHandling();
    const baseSpread = getBaseWeaponSpread(game.weapon.type, game.weapon.spread);
    game.weapon.spread = Math.round(baseSpread * handling.spreadMultiplier * 10000) / 10000;
    game.weapon.__realismHandling = handling;
  }

  function applyWeaponRecoilKick(game, shots = 1) {
    if (!game?.camera || game.session?.screen !== "playing") return;
    const handling = calculateWeaponHandling();
    const count = Math.max(1, Math.min(3, shots));
    const kick = handling.recoilKick * count;
    game.camera.rotation.x = clamp((game.camera.rotation.x || 0) - kick, -1.45, 1.45);
    game.camera.rotation.z += Math.sin((game.now || Date.now()) * 19.7) * handling.sideKick * count;
  }

  function getBaseWeaponSpread(type, fallback = 0.028) {
    if (type === "rifle") return 0.018;
    if (type === "marksman") return 0.008;
    if (type === "assault") return 0.028;
    return Number.isFinite(fallback) ? fallback : 0.028;
  }

  function consumeEquippedAmmo(game, used) {
    if (!used) return;
    const state = getEconomyState();
    const ammoItem = getEquippedAmmoItem(state);
    if (!ammoItem) return;
    const def = getMarketDefinition(ammoItem.defId);
    const weapon = getEquippedWeaponDef(state);
    if (def?.ammoClass === "aw" && weapon?.id !== "gun-awm") {
      state.equipped.ammo = "";
      saveEconomyState(state);
      markDeltaUiDirty();
      return;
    }
    ammoItem.remaining = Math.max(0, roundHealth((Number(ammoItem.remaining) || 0) - used));
    if (ammoItem.remaining <= 0) {
      state.inventory = state.inventory.filter((item) => item.uid !== ammoItem.uid);
      state.equipped.ammo = "";
      setGameMessage(game, `${def?.name || "子弹"} 已用完`);
    }
    saveEconomyState(state);
    markDeltaUiDirty();
  }

  function useMedicineItem(uid, game) {
    const state = getEconomyState();
    const item = state.inventory.find((entry) => entry.uid === uid);
    const def = getMarketDefinition(item?.defId);
    if (!item || !def || def.type !== "medicine") return;
    if (def.effect === "heal") useHealthRecovery(game, uid);
    if (def.effect === "swift") useSwiftInjector(game, uid);
  }

  function useHealthRecovery(game, preferredUid = "") {
    if (!game?.session || game.session.screen !== "playing") {
      setGameMessage(game, "进入战斗后才能使用血量恢复剂");
      return;
    }
    if (game.__realismPlayerRespawnAt || game.session.playerAlive === false) {
      setGameMessage(game, "倒地中，等待复活");
      return;
    }
    const state = getEconomyState();
    const index = findMedicineIndex(state, "heal", preferredUid);
    if (index < 0) {
      setGameMessage(game, "仓库里没有血量恢复剂");
      return;
    }
    const item = state.inventory[index];
    const remaining = Number.isFinite(item.remaining) ? item.remaining : 60;
    const health = getCurrentPlayerHealth(game);
    const missing = roundHealth(PLAYER_MAX_HEALTH - health);
    if (missing <= 0) {
      setGameMessage(game, "血量已满");
      return;
    }
    const healed = roundHealth(Math.min(missing, remaining));
    const newHealth = roundHealth(Math.min(PLAYER_MAX_HEALTH, health + healed));
    item.remaining = roundHealth(remaining - healed);
    if (item.remaining <= 0.05) state.inventory.splice(index, 1);
    saveEconomyState(state);
    if (!game.__realismPlayerDamageState) {
      game.__realismPlayerDamageState = { health: newHealth, nativeHealth: newHealth, damageFlash: 0 };
    }
    game.__realismPlayerDamageState.health = newHealth;
    game.__realismPlayerDamageState.nativeHealth = newHealth;
    writePlayerHealth(game, newHealth, true);
    setGameMessage(game, `血量恢复 ${healed}`);
    markDeltaUiDirty();
  }

  function useSwiftInjector(game, preferredUid = "") {
    if (!game?.session || game.session.screen !== "playing") {
      setGameMessage(game, "进入战斗后才能使用迅捷药剂");
      return;
    }
    const state = getEconomyState();
    const index = findMedicineIndex(state, "swift", preferredUid);
    if (index < 0) {
      setGameMessage(game, "仓库里没有迅捷药剂");
      return;
    }
    state.inventory.splice(index, 1);
    state.active = { ...(state.active || {}), swiftUntilMs: Date.now() + 10000 };
    saveEconomyState(state);
    applyConsumableEffects(game);
    setGameMessage(game, "迅捷药剂生效：速度提升 20%");
    markDeltaUiDirty();
  }

  function findMedicineIndex(state, effect, preferredUid = "") {
    if (preferredUid) {
      const preferred = state.inventory.findIndex((item) => !isItemInSecureContainer(state, item.uid) && item.uid === preferredUid && getMarketDefinition(item.defId)?.effect === effect);
      if (preferred >= 0) return preferred;
    }
    return state.inventory.findIndex((item) => !isItemInSecureContainer(state, item.uid) && getMarketDefinition(item.defId)?.effect === effect);
  }

  function getSwiftRemainingSeconds(state = getEconomyState()) {
    const until = Number(state.active?.swiftUntilMs || 0);
    return Math.max(0, (until - Date.now()) / 1000);
  }

  function getTotalHealPool(state) {
    return (state.inventory || []).reduce((sum, item) => {
      const def = getMarketDefinition(item.defId);
      if (isItemInSecureContainer(state, item.uid)) return sum;
      if (def?.effect !== "heal") return sum;
      return sum + (Number.isFinite(item.remaining) ? item.remaining : def.healPool || 60);
    }, 0);
  }

  function getCurrentPlayerHealth(game) {
    const stateHealth = game.__realismPlayerDamageState?.health;
    return clampHealth(Number.isFinite(stateHealth) ? stateHealth : game.session?.health, PLAYER_MAX_HEALTH);
  }

  function buyMarketItem(defId, game) {
    const def = getMarketDefinition(defId);
    if (!def) return;
    const state = getEconomyState();
    if (state.coins < def.cost) {
      setGameMessage(game, "游戏币不足");
      return;
    }
    state.coins -= def.cost;
    state.inventory.push(createInventoryItem(def));
    state.selectedTab = "warehouse";
    saveEconomyState(state);
    const root = document.getElementById("realism-delta-ui");
    if (root) root.dataset.tab = "warehouse";
    setGameMessage(game, `已购买 ${def.name}，已放入仓库`);
    markDeltaUiDirty();
  }

  function selectOperator(operatorId, game) {
    const operator = OPERATORS.find((entry) => entry.id === operatorId);
    if (!operator) return;
    const state = getEconomyState();
    state.equipped = { ...(state.equipped || {}), operator: operator.id };
    saveEconomyState(state);
    syncNativeOperatorSelection(state);
    setGameMessage(game, `已选择干员：${operator.name}`);
    markDeltaUiDirty();
  }

  function selectRaidMap(mapId, game) {
    const map = RAID_MAPS.find((entry) => entry.id === mapId) || RAID_MAPS[0];
    const state = getEconomyState();
    state.selectedMap = map.id;
    saveEconomyState(state);
    if (game) game.__realismSelectedMap = map.id;
    setGameMessage(game, `已选择地图：${map.name}`);
    markDeltaUiDirty();
  }

  function selectDeployMode(modeId, game) {
    const mode = normalizeDeployMode(modeId);
    const state = getEconomyState();
    state.deployMode = mode;
    if (mode === "multi" && !state.multiplayerRole) state.multiplayerRole = "host";
    saveEconomyState(state);
    if (game) game.selectedMode = mode === "multi" ? "lan" : "team";
    setGameMessage(game, mode === "multi" ? "已选择多人游戏" : "已选择单人突袭");
    markDeltaUiDirty();
  }

  function selectMultiplayerRole(roleId, game) {
    const role = normalizeMultiplayerRole(roleId);
    const state = getEconomyState();
    state.deployMode = "multi";
    state.multiplayerRole = role;
    saveEconomyState(state);
    setGameMessage(game, role === "host" ? "已选择房主" : "已选择房客");
    markDeltaUiDirty();
  }

  function createMultiplayerRoom(game) {
    const state = getEconomyState();
    state.deployMode = "multi";
    state.multiplayerRole = "host";
    state.multiplayerInviteCode = generateInviteCode();
    state.guestInviteCode = state.multiplayerInviteCode;
    saveEconomyState(state);
    configureLanRoom(game, state);
    setGameMessage(game, `房间已创建：${state.multiplayerInviteCode}`);
    markDeltaUiDirty();
  }

  function joinMultiplayerInvite(game) {
    const input = document.getElementById("delta-invite-input");
    const code = sanitizeInviteCode(input?.value || "");
    if (!code) {
      setGameMessage(game, "先输入房主的邀请码");
      return;
    }
    const state = getEconomyState();
    state.deployMode = "multi";
    state.multiplayerRole = "guest";
    state.guestInviteCode = code;
    saveEconomyState(state);
    configureLanRoom(game, state);
    syncNativeOperatorSelection(state);
    applyEquippedWeapon(game, true);
    clickNativeStartButton(game, "multi");
  }

  function prepareMultiplayerStart(game, state) {
    state.deployMode = "multi";
    state.multiplayerRole = normalizeMultiplayerRole(state.multiplayerRole || "host");
    if (state.multiplayerRole === "host") {
      state.multiplayerInviteCode = sanitizeInviteCode(state.multiplayerInviteCode) || generateInviteCode();
      state.guestInviteCode = state.multiplayerInviteCode;
    } else {
      const typedCode = sanitizeInviteCode(document.getElementById("delta-invite-input")?.value || "");
      state.guestInviteCode = typedCode || sanitizeInviteCode(state.guestInviteCode);
      if (!state.guestInviteCode) {
        saveEconomyState(state);
        setGameMessage(game, "房客需要先输入邀请码");
        markDeltaUiDirty();
        return false;
      }
    }
    saveEconomyState(state);
    configureLanRoom(game, state);
    return true;
  }

  function startSellLootItem(uid, game) {
    const state = getEconomyState();
    if (state.pendingSale?.uid) {
      setGameMessage(game, "交易行正在估价上一件物品");
      return;
    }
    const item = state.inventory.find((entry) => entry.uid === uid);
    const def = getMarketDefinition(item?.defId);
    if (!item || def?.type !== "loot") return;
    const duration = Math.max(0.5, Number(def.scanTime || 0.5));
    state.pendingSale = {
      uid,
      defId: def.id,
      startedAtMs: Date.now(),
      untilMs: Date.now() + duration * 1000
    };
    saveEconomyState(state);
    setGameMessage(game, `交易行正在鉴定：${def.name}`);
    markDeltaUiDirty();
  }

  function processPendingSale(game) {
    const state = getEconomyState();
    const pending = state.pendingSale;
    if (!pending?.uid || Date.now() < Number(pending.untilMs || 0)) return;
    const item = state.inventory.find((entry) => entry.uid === pending.uid);
    const def = getMarketDefinition(item?.defId || pending.defId);
    if (item && def?.type === "loot") {
      state.inventory = state.inventory.filter((entry) => entry.uid !== pending.uid);
      state.coins = Math.max(0, Math.round((state.coins || 0) + (def.value || 0)));
      setGameMessage(game, `已出售 ${def.name}，获得 ${formatCoins(def.value)} 游戏币`);
    }
    state.pendingSale = null;
    saveEconomyState(state);
    markDeltaUiDirty();
  }

  function sellWarehouseItem(uid, game) {
    const state = getEconomyState();
    const item = state.inventory.find((entry) => entry.uid === uid);
    const def = getMarketDefinition(item?.defId);
    const value = getWarehouseSellValue(def);
    if (!item || !value) return;
    if (isItemEquipped(state, uid)) {
      setGameMessage(game, "先卸下再出售");
      return;
    }
    state.inventory = state.inventory.filter((entry) => entry.uid !== uid);
    state.coins = Math.max(0, Math.round((state.coins || 0) + value));
    saveEconomyState(state);
    setGameMessage(game, `已出售 ${def.name}，获得 ${formatCoins(value)} 游戏币`);
    markDeltaUiDirty();
  }

  function carryTacticalItem(uid, game) {
    const state = getEconomyState();
    const item = state.inventory.find((entry) => entry.uid === uid);
    const def = getMarketDefinition(item?.defId);
    if (!item || def?.type !== "tactical") return;
    if (isItemInSecureContainer(state, uid)) {
      setGameMessage(game, "先从加密箱移出再带入");
      return;
    }
    item.location = "carried";
    saveEconomyState(state);
    setGameMessage(game, `${def.name} 已放入随身栏，战斗中按 ${def.effect === "grenade" ? "G" : "H"} 使用`);
    markDeltaUiDirty();
  }

  function moveItemToSecureContainer(uid, game) {
    const state = getEconomyState();
    const item = state.inventory.find((entry) => entry.uid === uid);
    const def = getMarketDefinition(item?.defId);
    if (!item || !def) return;
    if (isItemEquipped(state, uid)) {
      setGameMessage(game, "已装备的物品不能放进加密箱");
      return;
    }
    state.secureContainer = Array.isArray(state.secureContainer) ? state.secureContainer : [];
    if (state.secureContainer.includes(uid)) return;
    if (state.secureContainer.length >= SECURE_CONTAINER_CAPACITY) {
      setGameMessage(game, "加密箱已满");
      return;
    }
    state.secureContainer.push(uid);
    item.location = "secure";
    saveEconomyState(state);
    setGameMessage(game, `已放入加密箱：${def.name}`);
    markDeltaUiDirty();
  }

  function moveItemFromSecureContainer(uid, game) {
    const state = getEconomyState();
    const item = state.inventory.find((entry) => entry.uid === uid);
    const def = getMarketDefinition(item?.defId);
    if (!item || !def) return;
    if (def.type === "loot" && getBackpackFreeSlots(state) <= 0) {
      setGameMessage(game, "背包已满，不能移出变卖物");
      return;
    }
    state.secureContainer = (state.secureContainer || []).filter((entry) => entry !== uid);
    if (def.type === "loot") item.location = "backpack";
    else delete item.location;
    saveEconomyState(state);
    setGameMessage(game, `已移出加密箱：${def.name}`);
    markDeltaUiDirty();
  }

  function equipInventoryItem(uid, game) {
    const state = getEconomyState();
    const item = state.inventory.find((entry) => entry.uid === uid);
    const def = getMarketDefinition(item?.defId);
    if (!item || !def) return;
    if (isItemInSecureContainer(state, uid)) {
      setGameMessage(game, "先从加密箱移出再装备");
      return;
    }
    state.equipped = { ...(state.equipped || {}) };
    if (def.type === "weapon") {
      state.equipped.weapon = uid;
      enforceEquipmentCompatibility(state);
      saveEconomyState(state);
      applyEquippedWeapon(game, true);
      setGameMessage(game, `已装备 ${def.name}`);
      markDeltaUiDirty();
      return;
    }
    if (def.type === "ammo") {
      const weapon = getEquippedDefinition(state, "weapon");
      if (def.ammoClass === "aw" && weapon?.id !== "gun-awm") {
        setGameMessage(game, "AWM 专用子弹只能给 AWM 使用");
        return;
      }
      state.equipped.ammo = uid;
      saveEconomyState(state);
      setGameMessage(game, `已装备 ${def.name}`);
      markDeltaUiDirty();
      return;
    }
    if (["chestRig", "helmet", "armor", "backpack"].includes(def.type)) state.equipped[def.slot || def.type] = uid;
    if (def.type === "attachment") {
      if (def.sniperOnly && !isSniperWeaponEquipped(state)) {
        setGameMessage(game, "四倍瞄准镜只能装在狙击枪上");
        return;
      }
      const current = new Set(state.equipped.attachments || []);
      for (const other of state.inventory) {
        const otherDef = getMarketDefinition(other.defId);
        if (otherDef?.type === "attachment" && otherDef.slot === def.slot) current.delete(other.uid);
      }
      current.add(uid);
      state.equipped.attachments = [...current];
    }
    saveEconomyState(state);
    setGameMessage(game, `已装备 ${def.name}`);
    markDeltaUiDirty();
  }

  function unequipInventoryItem(uid, game) {
    const state = getEconomyState();
    const item = state.inventory.find((entry) => entry.uid === uid);
    const def = getMarketDefinition(item?.defId);
    if (!item || !def) return;
    state.equipped = { ...(state.equipped || {}) };
    if (state.equipped.weapon === uid) state.equipped.weapon = "";
    if (state.equipped.ammo === uid) state.equipped.ammo = "";
    if (state.equipped.chestRig === uid) state.equipped.chestRig = "";
    if (state.equipped.helmet === uid) state.equipped.helmet = "";
    if (state.equipped.armor === uid) state.equipped.armor = "";
    if (state.equipped.backpack === uid) state.equipped.backpack = "";
    if (Array.isArray(state.equipped.attachments)) state.equipped.attachments = state.equipped.attachments.filter((entry) => entry !== uid);
    enforceEquipmentCompatibility(state);
    saveEconomyState(state);
    setGameMessage(game, `已卸下 ${def.name}`);
    markDeltaUiDirty();
  }

  function clickNativeStartButton(game, deployMode = "raid") {
    const nativeMode = normalizeDeployMode(deployMode) === "multi" ? "lan" : "team";
    if (game) {
      game.selectedMode = nativeMode;
      game.lanClient = game.lanClient || {};
      if (game.lanClient && nativeMode !== "lan") game.lanClient.joined = false;
    }
    const buttons = [...document.querySelectorAll("button")].filter((button) => !button.closest("#realism-delta-ui"));
    const nativeStart = buttons.find((button) => /开始|部署|进入/.test(button.textContent || "")) || document.querySelector(".start-button");
    if (nativeStart) {
      nativeStart.click();
      return;
    }
    setGameMessage(game, "没有找到原来的开始按钮");
  }

  function syncNativeOperatorSelection(state) {
    const operator = getSelectedOperator(state);
    const choices = [...document.querySelectorAll(".role-card, button")].filter((node) => !node.closest("#realism-delta-ui"));
    const match = choices.find((node) => (node.textContent || "").includes(operator.name));
    match?.click?.();
  }

  function getEconomyState() {
    const fallback = createDefaultEconomyState();
    try {
      const saved = JSON.parse(localStorage.getItem(ECONOMY_STORAGE_KEY) || "null");
      if (!saved || typeof saved !== "object") return fallback;
      return normalizeEconomyState({ ...fallback, ...saved });
    } catch {
      return fallback;
    }
  }

  function saveEconomyState(state) {
    try {
      localStorage.setItem(ECONOMY_STORAGE_KEY, JSON.stringify(normalizeEconomyState(state)));
    } catch {
      // Local storage can be unavailable in rare embedded contexts; the match still works without persistence.
    }
  }

  function createDefaultEconomyState() {
    return {
      coins: 100000,
      inventory: [],
      equipped: { operator: "weicong", weapon: "", ammo: "", chestRig: "", helmet: "", armor: "", backpack: "", attachments: [] },
      active: { swiftUntilMs: 0 },
      selectedMap: "dam",
      deployMode: "raid",
      multiplayerRole: "host",
      multiplayerInviteCode: "",
      guestInviteCode: "",
      marketCategory: "medicine",
      pendingSale: null,
      secureContainer: [],
      selectedTab: "deploy"
    };
  }

  function normalizeEconomyState(state) {
    const clean = state && typeof state === "object" ? state : createDefaultEconomyState();
    clean.coins = Number.isFinite(clean.coins) ? Math.max(0, Math.round(clean.coins)) : 100000;
    clean.inventory = Array.isArray(clean.inventory) ? clean.inventory.filter((item) => item && getMarketDefinition(item.defId)) : [];
    clean.inventory = clean.inventory.map((item) => {
      const def = getMarketDefinition(item.defId);
      const copy = { ...item, uid: item.uid || createItemUid(), type: def.type };
      if (def.effect === "heal" && !Number.isFinite(copy.remaining)) copy.remaining = def.healPool || 60;
      if (def.type === "ammo" && !Number.isFinite(copy.remaining)) copy.remaining = def.rounds || 0;
      if (def.type === "loot" && copy.location !== "secure") copy.location = "backpack";
      return copy;
    });
    clean.equipped = {
      operator: OPERATORS.some((operator) => operator.id === clean.equipped?.operator) ? clean.equipped.operator : "weicong",
      weapon: clean.inventory.some((item) => item.uid === clean.equipped?.weapon) ? clean.equipped.weapon : "",
      ammo: clean.inventory.some((item) => item.uid === clean.equipped?.ammo) ? clean.equipped.ammo : "",
      chestRig: clean.inventory.some((item) => item.uid === clean.equipped?.chestRig) ? clean.equipped.chestRig : "",
      helmet: clean.inventory.some((item) => item.uid === clean.equipped?.helmet) ? clean.equipped.helmet : "",
      armor: clean.inventory.some((item) => item.uid === clean.equipped?.armor) ? clean.equipped.armor : "",
      backpack: clean.inventory.some((item) => item.uid === clean.equipped?.backpack) ? clean.equipped.backpack : "",
      attachments: Array.isArray(clean.equipped?.attachments)
        ? clean.equipped.attachments.filter((uid) => clean.inventory.some((item) => item.uid === uid))
        : []
    };
    enforceEquipmentCompatibility(clean);
    clean.active = { swiftUntilMs: Number(clean.active?.swiftUntilMs || 0) };
    clean.selectedMap = RAID_MAPS.some((map) => map.id === clean.selectedMap) ? clean.selectedMap : "dam";
    clean.deployMode = normalizeDeployMode(clean.deployMode || "raid");
    clean.multiplayerRole = normalizeMultiplayerRole(clean.multiplayerRole || "host");
    clean.multiplayerInviteCode = sanitizeInviteCode(clean.multiplayerInviteCode || "");
    clean.guestInviteCode = sanitizeInviteCode(clean.guestInviteCode || "");
    clean.marketCategory = normalizeMarketCategory(clean.marketCategory || "medicine");
    clean.pendingSale = clean.pendingSale?.uid ? clean.pendingSale : null;
    clean.secureContainer = Array.isArray(clean.secureContainer)
      ? clean.secureContainer
          .filter((uid, index, list) => list.indexOf(uid) === index)
          .filter((uid) => clean.inventory.some((item) => item.uid === uid))
          .slice(0, SECURE_CONTAINER_CAPACITY)
      : [];
    for (const item of clean.inventory) {
      if (clean.secureContainer.includes(item.uid)) item.location = "secure";
      else if (getMarketDefinition(item.defId)?.type === "loot" && item.location === "secure") item.location = "backpack";
    }
    clean.selectedTab = normalizeTab(clean.selectedTab || "deploy");
    return clean;
  }

  function createInventoryItem(def) {
    const item = {
      uid: createItemUid(),
      defId: def.id,
      type: def.type,
      acquiredAt: Date.now()
    };
    if (def.effect === "heal") item.remaining = def.healPool || 60;
    if (def.type === "ammo") item.remaining = def.rounds || 0;
    if (def.type === "tactical") item.location = "carried";
    if (def.type === "loot") {
      item.value = def.value || 0;
      item.location = "backpack";
    }
    return item;
  }

  function createItemUid() {
    if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
    return `item-${Date.now()}-${Math.floor(Math.random() * 100000)}`;
  }

  function getMarketDefinition(defId) {
    return MARKET_DEFS.find((item) => item.id === defId) || SELLABLE_DEFS.find((item) => item.id === defId);
  }

  function getSelectedOperator(state) {
    return OPERATORS.find((operator) => operator.id === state.equipped?.operator) || OPERATORS[0];
  }

  function calculatePlayerProtection(state = getEconomyState()) {
    const armor = getEquippedDefinition(state, "armor");
    const helmet = getEquippedDefinition(state, "helmet");
    const chestRig = getEquippedDefinition(state, "chestRig");
    const protection = Math.min(0.65, (armor?.protection || 0) + (helmet?.protection || 0) + (chestRig?.protection || 0));
    return {
      armor,
      helmet,
      chestRig,
      protection,
      incomingDamage: roundHealth(Math.max(2.5, ENEMY_BULLET_DAMAGE * (1 - protection)))
    };
  }

  function getIncomingPlayerDamage() {
    return calculatePlayerProtection().incomingDamage;
  }

  function getOutgoingBulletDamage(state = getEconomyState()) {
    const ammoItem = getEquippedAmmoItem(state);
    const ammo = ammoItem ? getMarketDefinition(ammoItem.defId) : null;
    const power = ammo?.power && ammoItem?.remaining > 0 ? ammo.power : 1;
    return roundHealth(BULLET_DAMAGE * Math.max(1, power));
  }

  function getEquippedDefinition(state, slot) {
    const uid = state.equipped?.[slot];
    const item = state.inventory?.find((entry) => entry.uid === uid);
    return item ? getMarketDefinition(item.defId) : null;
  }

  function getEquippedAmmoItem(state) {
    const uid = state.equipped?.ammo;
    return state.inventory?.find((entry) => entry.uid === uid) || null;
  }

  function getEquippedWeaponDef(state = getEconomyState()) {
    return getEquippedDefinition(state, "weapon");
  }

  function getEquippedAttachmentDefs(state) {
    const ids = new Set(state.equipped?.attachments || []);
    return (state.inventory || [])
      .filter((item) => ids.has(item.uid))
      .map((item) => getMarketDefinition(item.defId))
      .filter(Boolean);
  }

  function getEquippedAttachmentBySlot(slot, state = getEconomyState()) {
    return getEquippedAttachmentDefs(state).find((item) => item.slot === slot) || null;
  }

  function getWeaponAttachmentState(state = getEconomyState()) {
    const attachments = getEquippedAttachmentDefs(state);
    const bySlot = (slot) => attachments.find((item) => item.slot === slot) || null;
    return {
      attachments,
      optic: bySlot("optic"),
      laser: bySlot("laser"),
      grip: bySlot("grip"),
      stock: bySlot("stock"),
      muzzle: bySlot("muzzle"),
      mag: bySlot("mag"),
      isBare: attachments.length === 0
    };
  }

  function calculateWeaponHandling(state = getEconomyState()) {
    const attachmentState = getWeaponAttachmentState(state);
    let spreadMultiplier = attachmentState.isBare ? 1.48 : 1.16;
    let recoilKick = attachmentState.isBare ? 0.026 : 0.019;
    let sideKick = attachmentState.isBare ? 0.007 : 0.0045;
    if (attachmentState.grip) {
      spreadMultiplier *= 0.84;
      recoilKick *= 0.72;
      sideKick *= 0.74;
    }
    if (attachmentState.muzzle) {
      spreadMultiplier *= 0.9;
      recoilKick *= 0.78;
      sideKick *= 0.82;
    }
    if (attachmentState.stock) {
      spreadMultiplier *= 0.94;
      recoilKick *= 0.84;
      sideKick *= 0.86;
    }
    return {
      spreadMultiplier: Math.round(spreadMultiplier * 1000) / 1000,
      recoilKick: Math.round(recoilKick * 10000) / 10000,
      sideKick: Math.round(sideKick * 10000) / 10000,
      recoilLabel: attachmentState.isBare ? "高" : recoilKick < 0.012 ? "低" : "中"
    };
  }

  function isSniperWeaponEquipped(state = getEconomyState()) {
    const weapon = getEquippedWeaponDef(state);
    return !!weapon?.supports4x || weapon?.weaponClass === "sniper";
  }

  function isFourPowerScopeActive(state = getEconomyState()) {
    if (!isSniperWeaponEquipped(state)) return false;
    return getEquippedAttachmentDefs(state).some((item) => item.scopeType === "4x");
  }

  function enforceEquipmentCompatibility(state) {
    if (!isSniperWeaponEquipped(state)) {
      const keep = [];
      for (const uid of state.equipped?.attachments || []) {
        const item = state.inventory?.find((entry) => entry.uid === uid);
        const def = getMarketDefinition(item?.defId);
        if (!def?.sniperOnly) keep.push(uid);
      }
      state.equipped.attachments = keep;
    }
    const ammoItem = getEquippedAmmoItem(state);
    const ammoDef = ammoItem ? getMarketDefinition(ammoItem.defId) : null;
    const weapon = getEquippedWeaponDef(state);
    if (ammoDef?.ammoClass === "aw" && weapon?.id !== "gun-awm") state.equipped.ammo = "";
  }

  function applyEquippedWeapon(game, force = false) {
    if (!game?.weapon) return;
    const state = getEconomyState();
    const weapon = getEquippedWeaponDef(state);
    if (!weapon) {
      if (game.__realismEquippedWeaponUid) {
        try {
          game.setWeaponVariant?.(0);
        } catch {
          // If the native mode rejects switching, the dropped loadout is still cleared in the economy.
        }
        game.__realismEquippedWeaponUid = "";
        makeWeaponLessToyLike(game, window.__FPS_THREE__);
      }
      return;
    }
    if (!force && game.__realismEquippedWeaponUid === state.equipped.weapon && game.weapon?.label === weapon.name) return;
    if (typeof game.setWeaponVariant === "function" && Number.isFinite(weapon.nativeIndex)) {
      try {
        game.setWeaponVariant(weapon.nativeIndex);
      } catch {
        // Some match modes lock native weapon switching; the visual label is still updated below.
      }
    }
    if (game.weapon) {
      game.weapon.type = weapon.nativeType || game.weapon.type;
      game.weapon.label = weapon.name;
      if (weapon.id === "gun-bizon") {
        game.weapon.magazineSize = 64;
        game.weapon.ammo = Math.min(game.weapon.ammo || 64, game.weapon.magazineSize);
      }
      if (weapon.id === "gun-awm") {
        game.weapon.magazineSize = Math.min(game.weapon.magazineSize || 25, 8);
        game.weapon.ammo = Math.min(game.weapon.ammo || 8, game.weapon.magazineSize);
        game.weapon.fireMode = "semi";
      }
    }
    game.__realismEquippedWeaponUid = state.equipped.weapon;
    makeWeaponLessToyLike(game, window.__FPS_THREE__);
  }

  function isItemEquipped(state, uid) {
    return state.equipped?.weapon === uid || state.equipped?.ammo === uid || state.equipped?.chestRig === uid || state.equipped?.helmet === uid || state.equipped?.armor === uid || state.equipped?.backpack === uid || (state.equipped?.attachments || []).includes(uid);
  }

  function getBackpackLootItems(state = getEconomyState()) {
    return (state.inventory || []).filter((item) => getMarketDefinition(item.defId)?.type === "loot" && item.location !== "secure" && !isItemInSecureContainer(state, item.uid));
  }

  function getWarehouseItems(state = getEconomyState()) {
    return (state.inventory || []).filter((item) => getMarketDefinition(item.defId)?.type !== "loot" && !isItemInSecureContainer(state, item.uid));
  }

  function getSecureContainerItems(state = getEconomyState()) {
    const secure = new Set(state.secureContainer || []);
    return (state.inventory || []).filter((item) => secure.has(item.uid));
  }

  function isItemInSecureContainer(state, uid) {
    return !!uid && (state.secureContainer || []).includes(uid);
  }

  function getBackpackStatus(state = getEconomyState()) {
    const def = getEquippedDefinition(state, "backpack");
    const capacity = 8 + Math.max(0, Number(def?.capacity || 0));
    const used = getBackpackLootItems(state).length;
    return { capacity, used, free: Math.max(0, capacity - used) };
  }

  function getBackpackFreeSlots(state = getEconomyState()) {
    return getBackpackStatus(state).free;
  }

  function isWarehouseSellableDefinition(def) {
    return ["chestRig", "helmet", "armor", "backpack"].includes(def?.type);
  }

  function getWarehouseSellValue(def) {
    if (!isWarehouseSellableDefinition(def)) return 0;
    return Math.max(1, Math.round((def.cost || 0) * 0.65));
  }

  function countInventoryItem(state, defId) {
    return (state.inventory || []).filter((item) => item.defId === defId).length;
  }

  function getInventoryAction(def, equipped) {
    if (def.type === "medicine") return { id: "use-medicine", label: "使用" };
    if (def.type === "loot") return { id: "sell-loot", label: "出售" };
    if (def.type === "tactical") return { id: "carry-tactical", label: "带入" };
    if (equipped) return { id: "unequip-item", label: "卸下" };
    return { id: "equip-item", label: "装备" };
  }

  function getItemRemainingText(item, def) {
    if (def.effect === "heal") return `剩余恢复 ${Math.round(Number.isFinite(item.remaining) ? item.remaining : def.healPool || 60)}`;
    if (def.effect === "swift") return "持续 10 秒";
    if (def.effect === "grenade") return `G 投掷，爆炸半径 ${def.radius} 米`;
    if (def.effect === "flash") return `H 投掷，白屏 ${def.duration || 3} 秒`;
    if (def.type === "ammo") return `剩余 ${Math.round(Number.isFinite(item.remaining) ? item.remaining : def.rounds || 0)} / ${def.rounds} 发`;
    if (def.type === "weapon") return def.weaponClass === "sniper" ? "狙击枪，可用四倍镜" : `使用 ${def.ammoClass === "aw" ? "AWM" : "通用"} 子弹`;
    if (def.type === "loot") return `可卖 ${formatCoins(def.value)} 游戏币`;
    if (def.capacity) return `容量 +${def.capacity}`;
    if (def.protection) return `防护 ${Math.round(def.protection * 100)}%`;
    return def.slot ? `槽位 ${def.slot}` : "";
  }

  function getItemTypeLabel(item) {
    if (item.type === "weapon") return "枪械";
    if (item.type === "ammo") return "子弹";
    if (item.type === "chestRig") return "胸挂";
    if (item.type === "helmet") return "头盔";
    if (item.type === "armor") return "护甲";
    if (item.type === "backpack") return "背包";
    if (item.type === "attachment") return "配件";
    if (item.type === "medicine") return "药品";
    if (item.type === "tactical") return "战术道具";
    if (item.type === "loot") return "变卖物";
    return "物品";
  }

  function normalizeTab(tab) {
    return ["deploy", "warehouse", "operators", "market", "exchange"].includes(tab) ? tab : "deploy";
  }

  function normalizeMarketCategory(category) {
    return MARKET_CATEGORIES.some((item) => item.id === category) ? category : "medicine";
  }

  function normalizeDeployMode(mode) {
    return mode === "lan" || mode === "multi" ? "multi" : "raid";
  }

  function normalizeMultiplayerRole(role) {
    return role === "guest" ? "guest" : "host";
  }

  function sanitizeInviteCode(value) {
    return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  }

  function generateInviteCode() {
    const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < 4; i += 1) code += alphabet[Math.floor(Math.random() * alphabet.length)];
    return code;
  }

  function getActiveInviteCode(state = getEconomyState()) {
    return state.multiplayerRole === "guest"
      ? sanitizeInviteCode(state.guestInviteCode || "")
      : sanitizeInviteCode(state.multiplayerInviteCode || "");
  }

  function inviteCodeToRoomId(code) {
    return `delta-room-${sanitizeInviteCode(code).toLowerCase()}`;
  }

  function configureLanRoom(game, state = getEconomyState()) {
    if (!game) return;
    const code = getActiveInviteCode(state);
    if (!code) return;
    game.__realismLanRoomId = inviteCodeToRoomId(code);
    patchLanClientRoom(game);
  }

  function patchLanClientRoom(game) {
    const client = game?.lanClient;
    if (!client || client.__realismRoomPatch) return;
    const originalJoin = typeof client.join === "function" ? client.join.bind(client) : null;
    if (originalJoin) {
      client.join = (payload = {}) => originalJoin({
        ...payload,
        targetRoomId: game.__realismLanRoomId || payload.targetRoomId || payload.roomId
      });
    }
    client.__realismRoomPatch = true;
  }

  function getSelectedMap(state = getEconomyState()) {
    return RAID_MAPS.find((map) => map.id === state.selectedMap) || RAID_MAPS[0];
  }

  function getTierLabel(tier) {
    return LOOT_TIERS.find((item) => item.id === tier)?.label || GEAR_TIERS.find((item) => item.id === tier)?.label || "";
  }

  function formatCoins(value) {
    return Math.max(0, Number(value) || 0).toLocaleString("zh-CN");
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function markDeltaUiDirty() {
    const root = document.getElementById("realism-delta-ui");
    if (root) root.dataset.dirty = "1";
  }

  function setGameMessage(game, message) {
    if (game) game.message = message;
  }

  function isTextInputEvent(event) {
    const target = event.target;
    if (!target) return false;
    const tag = target.tagName?.toLowerCase();
    return tag === "input" || tag === "textarea" || target.isContentEditable;
  }

  function publishRealismStatus(game) {
    if (!document?.body) return;
    const economy = getEconomyState();
    const protection = calculatePlayerProtection(economy);
    const weapon = getEquippedWeaponDef(economy);
    const ammo = getEquippedAmmoItem(economy);
    const ammoDef = ammo ? getMarketDefinition(ammo.defId) : null;
    const attachmentState = getWeaponAttachmentState(economy);
    const handling = calculateWeaponHandling(economy);
    document.body.dataset.realismStatus = JSON.stringify({
      version: VERSION,
      bulletDamage: BULLET_DAMAGE,
      enemyBulletDamage: ENEMY_BULLET_DAMAGE,
      outgoingBulletDamage: getOutgoingBulletDamage(economy),
      shotsToDown: SHOTS_TO_DOWN,
      matchDuration: MATCH_DURATION_SECONDS,
      remainingTime: getRoundRemainingSeconds(game),
      respawnDelay: RESPAWN_DELAY,
      coins: economy.coins,
      inventoryItems: economy.inventory?.length || 0,
      warehouseItems: getWarehouseItems(economy).length,
      backpackItems: getBackpackLootItems(economy).length,
      secureItems: getSecureContainerItems(economy).length,
      secureCapacity: SECURE_CONTAINER_CAPACITY,
      selectedMap: getSelectedMap(economy).name,
      sellableItems: (economy.inventory || []).filter((item) => getMarketDefinition(item.defId)?.type === "loot").length,
      equippedWeapon: weapon?.name || "",
      equippedAmmo: ammoDef?.name || "",
      equippedAmmoRemaining: ammo?.remaining || 0,
      bareGun: attachmentState.isBare,
      equippedAttachments: attachmentState.attachments.map((item) => item.name),
      optic: attachmentState.optic?.name || "",
      laser: !!attachmentState.laser,
      awmRedHeadshot: isAwRedAmmoHeadshotReady(economy),
      weaponSpread: game.weapon?.spread || 0,
      recoilLabel: handling.recoilLabel,
      fourPowerScope: isFourPowerScopeActive(economy),
      protection: protection.protection,
      incomingPlayerDamage: protection.incomingDamage,
      swiftRemaining: getSwiftRemainingSeconds(economy),
      healPool: getTotalHealPool(economy),
      playerHealth: getCurrentPlayerHealth(game),
      doors: game.__realismDoors?.length || 0,
      lootContainers: game.arena?.group?.__realismLootContainers?.length || 0,
      colliders: game.arena?.colliders?.length || 0,
      searchOpen: !!game.__realismSearch,
      bridgeWaterSeconds: getBridgeWaterRemainingSeconds(game),
      searchRevealed: !!game.__realismSearch?.revealed,
      loadoutOpen: !!game.__realismLoadoutOpen,
      extractZone: !!game.arena?.group?.__realismExtractionZone,
      extracting: !!game.__realismExtraction,
      extracted: !!game.__realismExtraction?.completed,
      raidFailed: !!game.__realismRaidFailure,
      blueSpawns: game.arena?.teamSpawns?.blue?.length || 0,
      redSpawns: game.arena?.teamSpawns?.red?.length || 0,
      blueSoldiers: (game.enemyRecords || []).filter((record) => record.enemy?.team === "blue").length,
      redSoldiers: (game.enemyRecords || []).filter((record) => record.enemy?.team === "red").length,
      wallDecorFixed: !!game.arena?.__realismWallDecorDone,
      screen: game.session?.screen || ""
    });
  }

  function improveLighting(game, T) {
    applyRealisticRenderPipeline(game, T);
    if (game.renderer?.setClearColor) game.renderer.setClearColor(0x82929a, 1);
    if (game.__realismLightingDone || !game.scene) return;
    game.__realismLightingDone = true;

    const hemi = new T.HemisphereLight(0xddebf2, 0x364232, 1.72);
    hemi.name = "realistic-open-sky-light";
    game.scene.add(hemi);

    const sun = new T.DirectionalLight(0xffe2b8, 3.15);
    sun.name = "realistic-low-sun";
    sun.position.set(-24, 42, 16);
    sun.castShadow = true;
    if (sun.shadow?.mapSize) sun.shadow.mapSize.set(2048, 2048);
    if (sun.shadow?.camera) {
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 150;
      sun.shadow.camera.left = -82;
      sun.shadow.camera.right = 82;
      sun.shadow.camera.top = 82;
      sun.shadow.camera.bottom = -82;
    }
    game.scene.add(sun);
    const sunDisk = new T.Mesh(new T.SphereGeometry(1.35, 32, 18), game.__realismMats?.sunGlow || new T.MeshStandardMaterial({ color: 0xffd47a }));
    sunDisk.name = "visible-sun-disk";
    sunDisk.position.set(-34, 30, -24);
    game.scene.add(sunDisk);
  }

  function applyRealisticRenderPipeline(game, T) {
    if (!game || game.__realismRenderPipelineDone) return;
    game.__realismRenderPipelineDone = true;
    const renderer = game.renderer;
    if (renderer) {
      if (T?.ACESFilmicToneMapping) renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      if (T?.SRGBColorSpace) renderer.outputColorSpace = T.SRGBColorSpace;
      if (renderer.shadowMap) {
        renderer.shadowMap.enabled = true;
        if (T?.PCFSoftShadowMap) renderer.shadowMap.type = T.PCFSoftShadowMap;
      }
      renderer.physicallyCorrectLights = true;
    }
    if (game.scene && T?.FogExp2) {
      game.scene.fog = new T.FogExp2(0x7f8d90, 0.0065);
    }
    if (game.camera) {
      game.camera.far = Math.max(260, Number(game.camera.far || 0));
      game.camera.near = Math.min(0.08, Number(game.camera.near || 0.1));
      game.camera.updateProjectionMatrix?.();
    }
  }

  function expandArena(arena) {
    if (arena.__realismExpanded) return;
    arena.__realismExpanded = true;
    const factor = arena.mode === "range" ? 1.45 : Math.max(EXPAND_FACTOR, getSelectedMap().scale || EXPAND_FACTOR);

    for (const key of ["size", "width", "depth"]) {
      if (typeof arena[key] === "number") arena[key] *= factor;
    }

    for (const mesh of arena.meshes || []) {
      if (!mesh || !mesh.position) continue;
      const params = mesh.geometry?.parameters || {};
      const isFloor = mesh.position.y < 0 && (params.width || 0) > 15 && (params.depth || 0) > 15;
      mesh.position.x *= factor;
      mesh.position.z *= factor;
      if (isFloor) {
        mesh.scale.x *= factor;
        mesh.scale.z *= factor;
      }
      if (mesh.name === "boundary-wall") {
        if ((params.width || 0) >= (params.depth || 0)) mesh.scale.x *= factor;
        else mesh.scale.z *= factor;
      }
    }

    for (const collider of arena.colliders || []) {
      collider.minX *= factor;
      collider.maxX *= factor;
      collider.minZ *= factor;
      collider.maxZ *= factor;
    }

    scalePoint(arena.playerSpawn, factor);
    for (const listName of ["enemySpawns", "botRoute"]) {
      for (const point of arena[listName] || []) scalePoint(point, factor);
    }
    if (arena.teamSpawns) {
      for (const team of Object.keys(arena.teamSpawns)) {
        for (const point of arena.teamSpawns[team] || []) scalePoint(point, factor);
      }
    }
  }

  function scalePoint(point, factor) {
    if (!point) return;
    if (typeof point.x === "number") point.x *= factor;
    if (typeof point.z === "number") point.z *= factor;
  }

  function upgradeArena(game, T) {
    const arena = game.arena;
    if (!arena || !arena.group) return;
    const mats = game.__realismMats;

    for (const mesh of arena.meshes || []) {
      if (!mesh?.isMesh) continue;
      tuneArenaMesh(mesh, mats);
      addSurfaceBreakup(arena.group, mesh, T, mats);
      softenBlockEdges(arena.group, mesh, T, mats);
    }
    attachFloatingWallDecorations(arena, T, mats);

    if (arena.__realismLayoutAdded) return;
    arena.__realismLayoutAdded = true;
    addExpandedCover(arena, T, mats);
    addEnvironmentalDetail(arena, T, mats);
    game.__realismDoors = arena.group.__realismDoors || [];
  }

  function tuneArenaMesh(mesh, mats) {
    if (mesh.__realismMaterialDone) return;
    mesh.__realismMaterialDone = true;
    const name = mesh.name || "";
    const y = mesh.position?.y || 0;

    if (y < 0) mesh.material = mats.roof;
    else if (name.includes("window")) mesh.material = mats.glass;
    else if (name.includes("ladder") || name.includes("rail") || name.includes("antenna")) mesh.material = mats.darkMetal;
    else if (name.includes("boundary") || name.includes("central") || name.includes("high-building")) mesh.material = mats.stainedConcrete;
    else if (name.includes("climb") || name.includes("cover") || name.includes("parapet")) mesh.material = mats.concrete;
    else if (name.includes("crate")) mesh.material = mats.canvas;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
  }

  function addSurfaceBreakup(root, mesh, T, mats) {
    if (mesh.__realismBreakupDone) return;
    mesh.__realismBreakupDone = true;
    const params = mesh.geometry?.parameters || {};
    const w = (params.width || 0) * (mesh.scale?.x || 1);
    const h = (params.height || 0) * (mesh.scale?.y || 1);
    const d = (params.depth || 0) * (mesh.scale?.z || 1);
    if (h < 0.6 || Math.max(w, d) < 3) return;

    const count = Math.min(5, Math.max(2, Math.floor(Math.max(w, d) / 5)));
    for (let i = 1; i < count; i += 1) {
      const t = i / count - 0.5;
      if (w >= d) {
        addBox(root, T, mesh.position.x + t * w, mesh.position.y + h * 0.12, mesh.position.z - d / 2 - 0.014, 0.035, h * 0.58, 0.028, mats.grime, "weathered-seam");
        addBox(root, T, mesh.position.x + t * w, mesh.position.y + h * 0.12, mesh.position.z + d / 2 + 0.014, 0.035, h * 0.58, 0.028, mats.grime, "weathered-seam");
      } else {
        addBox(root, T, mesh.position.x - w / 2 - 0.014, mesh.position.y + h * 0.12, mesh.position.z + t * d, 0.028, h * 0.58, 0.035, mats.grime, "weathered-seam");
        addBox(root, T, mesh.position.x + w / 2 + 0.014, mesh.position.y + h * 0.12, mesh.position.z + t * d, 0.028, h * 0.58, 0.035, mats.grime, "weathered-seam");
      }
    }
  }

  function addSearchableContainers(arena, T, mats) {
    if (arena.group.__realismLootContainers?.length) return;
    const root = arena.group;
    root.__realismLootContainers = [];
    const points = getSearchContainerPoints(getSelectedMap().id);
    for (const point of points) {
      const { x, z, label, tier, bias, kind, rotation = 0 } = point;
      const group = new T.Group();
      group.name = "searchable-loot-container";
      group.position.set(x, 0, z);
      group.rotation.y = rotation;
      group.userData = { label, searched: false, tier, lootBias: bias, kind };
      const bounds = addSearchContainerModel(group, T, mats, kind, tier);
      root.add(group);
      root.__realismLootContainers.push(group);
      const halfW = (Math.abs(Math.cos(rotation)) * bounds.w + Math.abs(Math.sin(rotation)) * bounds.d) / 2;
      const halfD = (Math.abs(Math.sin(rotation)) * bounds.w + Math.abs(Math.cos(rotation)) * bounds.d) / 2;
      arena.colliders.push({
        name: "searchable-loot-container",
        minX: x - halfW,
        maxX: x + halfW,
        minY: 0,
        maxY: bounds.h,
        minZ: z - halfD,
        maxZ: z + halfD,
        climbable: false,
        ladder: false
      });
    }
  }

  function getLootMaterial(mats, tier) {
    if (tier === "red") return mats.lootRed;
    if (tier === "gold") return mats.lootGold;
    if (tier === "blue") return mats.lootBlue;
    if (tier === "green") return mats.lootGreen;
    return mats.lootWhite;
  }

  function attachFloatingWallDecorations(arena, T, mats) {
    if (!arena.group || arena.__realismWallDecorDone) return;
    arena.__realismWallDecorDone = true;
    const buildings = getWallHostMeshes(arena);
    for (const building of buildings.slice(0, 10)) addFacadeDetailsForBuilding(arena.group, building, T, mats);

    const candidates = [];
    arena.group.traverse((child) => {
      const name = (child.name || "").toLowerCase();
      if (!child.position || (!name.includes("window") && !name.includes("graffiti") && !name.includes("poster"))) return;
      if (name.includes("street-shop") || name.includes("interactive-shop") || name.includes("fixed-wall") || name.includes("door")) return;
      candidates.push(child);
    });

    for (const child of candidates) {
      const face = findNearestWallFace(child.position, buildings);
      if (!face || face.score > 16) continue;
      child.position.x = face.x;
      child.position.z = face.z;
      if (child.rotation) child.rotation.y = face.axis === "x" ? Math.PI / 2 : 0;
      child.renderOrder = 3;
    }
  }

  function getWallHostMeshes(arena) {
    return (arena.meshes || []).filter((mesh) => {
      if (!mesh?.isMesh || !mesh.geometry?.parameters || !mesh.position) return false;
      const name = (mesh.name || "").toLowerCase();
      if (name.includes("window") || name.includes("graffiti") || name.includes("door") || name.includes("boundary")) return false;
      const p = mesh.geometry.parameters;
      const w = (p.width || 0) * (mesh.scale?.x || 1);
      const h = (p.height || 0) * (mesh.scale?.y || 1);
      const d = (p.depth || 0) * (mesh.scale?.z || 1);
      return h > 2.4 && Math.max(w, d) > 3.2 && mesh.position.y + h / 2 > 2.7;
    });
  }

  function addFacadeDetailsForBuilding(root, mesh, T, mats) {
    if (mesh.__realismFacadeDetailsDone) return;
    mesh.__realismFacadeDetailsDone = true;
    const p = mesh.geometry?.parameters || {};
    const w = (p.width || 0) * (mesh.scale?.x || 1);
    const h = (p.height || 0) * (mesh.scale?.y || 1);
    const d = (p.depth || 0) * (mesh.scale?.z || 1);
    if (h < 2.8) return;

    const axis = Math.abs(mesh.position.x) >= Math.abs(mesh.position.z) ? "x" : "z";
    const sign = axis === "x" ? (mesh.position.x < 0 ? 1 : -1) : (mesh.position.z < 0 ? 1 : -1);
    const faceWidth = axis === "x" ? d : w;
    const levels = Math.min(3, Math.max(1, Math.floor(h / 1.25)));
    const cols = Math.min(4, Math.max(2, Math.floor(faceWidth / 1.6)));
    const bottom = mesh.position.y - h / 2;
    for (let row = 0; row < levels; row += 1) {
      const y = bottom + 1.0 + row * 0.78;
      if (y > mesh.position.y + h / 2 - 0.45) continue;
      for (let col = 0; col < cols; col += 1) {
        const offset = (col - (cols - 1) / 2) * Math.min(1.55, faceWidth / (cols + 0.5));
        addWallPanel(root, T, mesh, axis, sign, offset, y, 0.78, 0.45, mats.glass, "fixed-wall-window");
        addWallPanel(root, T, mesh, axis, sign, offset, y, 0.9, 0.055, mats.windowFrame, "fixed-wall-window-frame");
        addWallPanel(root, T, mesh, axis, sign, offset, y, 0.055, 0.52, mats.windowFrame, "fixed-wall-window-frame");
      }
    }
    addWallPanel(root, T, mesh, axis, sign, -faceWidth * 0.18, bottom + 0.72, 1.35, 0.42, mats.graffitiPaint, "fixed-wall-graffiti");
    addWallPanel(root, T, mesh, axis, sign, -faceWidth * 0.18, bottom + 0.88, 1.0, 0.08, mats.warmLight, "fixed-wall-graffiti-highlight");
  }

  function addWallPanel(root, T, host, axis, sign, lateral, y, width, height, material, name) {
    const p = host.geometry?.parameters || {};
    const w = (p.width || 0) * (host.scale?.x || 1);
    const d = (p.depth || 0) * (host.scale?.z || 1);
    const extraLift = (name.includes("frame") || name.includes("highlight")) ? 0.018 * sign : 0;
    const inset = 0.045 * sign + extraLift;
    if (axis === "x") {
      const x = host.position.x + sign * w / 2 + inset;
      const z = clamp(lateral, -d / 2 + width / 2 + 0.2, d / 2 - width / 2 - 0.2) + host.position.z;
      return addBox(root, T, x, y, z, 0.055, height, width, material, name);
    }
    const z = host.position.z + sign * d / 2 + inset;
    const x = clamp(lateral, -w / 2 + width / 2 + 0.2, w / 2 - width / 2 - 0.2) + host.position.x;
    return addBox(root, T, x, y, z, width, height, 0.055, material, name);
  }

  function findNearestWallFace(point, buildings) {
    let best = null;
    for (const building of buildings) {
      const p = building.geometry?.parameters || {};
      const w = (p.width || 0) * (building.scale?.x || 1);
      const h = (p.height || 0) * (building.scale?.y || 1);
      const d = (p.depth || 0) * (building.scale?.z || 1);
      const yMin = building.position.y - h / 2;
      const yMax = building.position.y + h / 2;
      const yPenalty = point.y < yMin ? yMin - point.y : point.y > yMax ? point.y - yMax : 0;
      const faces = [
        { axis: "x", sign: -1, x: building.position.x - w / 2 - 0.045, z: clamp(point.z, building.position.z - d / 2 + 0.2, building.position.z + d / 2 - 0.2), lateral: Math.max(0, Math.abs(point.z - building.position.z) - d / 2), plane: Math.abs(point.x - (building.position.x - w / 2)) },
        { axis: "x", sign: 1, x: building.position.x + w / 2 + 0.045, z: clamp(point.z, building.position.z - d / 2 + 0.2, building.position.z + d / 2 - 0.2), lateral: Math.max(0, Math.abs(point.z - building.position.z) - d / 2), plane: Math.abs(point.x - (building.position.x + w / 2)) },
        { axis: "z", sign: -1, z: building.position.z - d / 2 - 0.045, x: clamp(point.x, building.position.x - w / 2 + 0.2, building.position.x + w / 2 - 0.2), lateral: Math.max(0, Math.abs(point.x - building.position.x) - w / 2), plane: Math.abs(point.z - (building.position.z - d / 2)) },
        { axis: "z", sign: 1, z: building.position.z + d / 2 + 0.045, x: clamp(point.x, building.position.x - w / 2 + 0.2, building.position.x + w / 2 - 0.2), lateral: Math.max(0, Math.abs(point.x - building.position.x) - w / 2), plane: Math.abs(point.z - (building.position.z + d / 2)) }
      ];
      for (const face of faces) {
        const score = face.plane + face.lateral * 0.8 + yPenalty * 0.35;
        if (!best || score < best.score) best = { ...face, score };
      }
    }
    return best;
  }

  function clamp(value, min, max) {
    if (min > max) return (min + max) / 2;
    return Math.max(min, Math.min(max, value));
  }

  function addBrickPaving(root, T, mats, x, y, z, w, d) {

    for (let row = 0; row < rows; row += 1) {
      for (let col = 0; col < cols; col += 1) {
        const bx = x - w / 2 + 0.75 + col * 1.4 + (row % 2) * 0.35;

        brick.rotation.y = (row % 2 ? 0.025 : -0.025);
      }
    }
  }
