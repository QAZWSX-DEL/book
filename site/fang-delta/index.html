  function createProceduralTexture(T, kind, base, accent, repeat = 6) {
    if (!T?.CanvasTexture) return null;
    const canvas = document.createElement("canvas");
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const seed = hashCode(`${kind}:${base}:${accent}`);
    for (let i = 0; i < 520; i += 1) {
      const n = Math.abs(Math.sin(seed + i * 91.73));
      const x = Math.floor((n * 9173) % canvas.width);
      const y = Math.floor((n * 6113) % canvas.height);
      const alpha = 0.04 + (n % 0.12);
      ctx.fillStyle = n > 0.52 ? `rgba(255,255,255,${alpha})` : `rgba(0,0,0,${alpha})`;
      ctx.fillRect(x, y, 1 + Math.floor(n * 3), 1 + Math.floor(n * 3));
    }
    if (kind === "brick") {
      ctx.strokeStyle = "rgba(20, 24, 22, 0.34)";
      ctx.lineWidth = 2;
      for (let y = 0; y <= 128; y += 24) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(128, y);
        ctx.stroke();
        for (let x = (y / 24) % 2 ? 0 : 24; x <= 128; x += 48) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + 24);
          ctx.stroke();
        }
      }
    } else if (kind === "asphalt") {
      ctx.strokeStyle = "rgba(210, 220, 214, 0.09)";
      for (let i = 0; i < 18; i += 1) {
        ctx.beginPath();
        ctx.moveTo((i * 23) % 128, 0);
        ctx.lineTo(((i * 23) % 128) + 20, 128);
        ctx.stroke();
      }
    } else if (kind === "fabric" || kind === "grass") {
      ctx.strokeStyle = accent;
      ctx.globalAlpha = kind === "grass" ? 0.2 : 0.12;
      for (let i = 0; i < 42; i += 1) {
        const x = (i * 37) % 128;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo((x + 18) % 128, 128);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.strokeStyle = "rgba(0,0,0,0.14)";
      for (let y = 0; y <= 128; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(128, y + 7);
        ctx.stroke();
      }
    }
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.07;
    ctx.fillRect(0, 0, 128, 128);
    ctx.globalAlpha = 1;
    const texture = new T.CanvasTexture(canvas);
    texture.wrapS = T.RepeatWrapping;
    texture.wrapT = T.RepeatWrapping;
    texture.repeat.set(repeat, repeat);
    if (T.SRGBColorSpace) texture.colorSpace = T.SRGBColorSpace;
    texture.needsUpdate = true;
    return texture;
  }

        box-shadow: 0 0 8px rgba(255, 31, 31, 0.95), 0 0 2px rgba(0, 0, 0, 0.7) !important;
      }
      body.realism-ads-open .crosshair {
        opacity: 0 !important;
      }
      body.realism-ads-4x .scope-overlay.is-open {
        background: radial-gradient(circle at center, transparent 0 31%, rgba(0, 0, 0, 0.88) 31.5% 100%) !important;
      }
      body.realism-ads-4x .scope-overlay.is-open::before {
        width: min(52vw, 520px) !important;
        height: min(52vw, 520px) !important;
        border: 2px solid rgba(226, 232, 240, 0.78) !important;
        border-radius: 50% !important;
        background:
          linear-gradient(90deg, transparent calc(50% - 1px), rgba(248, 250, 252, 0.82) calc(50% - 1px), rgba(248, 250, 252, 0.82) calc(50% + 1px), transparent calc(50% + 1px)),
          linear-gradient(0deg, transparent calc(50% - 1px), rgba(248, 250, 252, 0.82) calc(50% - 1px), rgba(248, 250, 252, 0.82) calc(50% + 1px), transparent calc(50% + 1px)),
          radial-gradient(circle, rgba(125, 211, 252, 0.08), transparent 62%) !important;
        box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.42), 0 0 0 999px rgba(0, 0, 0, 0.2) !important;
      }
      body.realism-ads-4x .scope-overlay.is-open::after {
        width: 9px !important;
        height: 9px !important;
        background: #ef4444 !important;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.95) !important;
      }
      body.realism-no-optic .scope-overlay.is-open {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    `;
    document.head.appendChild(style);
  }

  function installFlashOverlay() {
    const styleId = "realism-flash-overlay-style";
    document.getElementById(styleId)?.remove();
    const style = document.createElement("style");
    style.id = styleId;
    style.textContent = `
      #realism-flash-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: white;
        opacity: 0;
        pointer-events: none;
        transition: opacity 90ms linear;
      }
      body.realism-flashed #realism-flash-overlay {
        pointer-events: none;
      }
    `;
    document.head.appendChild(style);
    if (!document.getElementById("realism-flash-overlay")) {
      const overlay = document.createElement("div");
      overlay.id = "realism-flash-overlay";
      document.body.appendChild(overlay);
    }
  }

  function triggerFlashOverlay(game, seconds = 3) {
    const until = Date.now() + Math.max(0.2, Number(seconds) || 3) * 1000;
    if (game) game.__realismFlashUntilMs = Math.max(Number(game.__realismFlashUntilMs || 0), until);
    updateFlashOverlay(game);
  }

  function updateFlashOverlay(game) {
    const overlay = document.getElementById("realism-flash-overlay");
    if (!overlay) return;
    const remaining = Math.max(0, Number(game?.__realismFlashUntilMs || 0) - Date.now());
    const opacity = remaining <= 0 ? 0 : remaining > 520 ? 1 : remaining / 520;
    overlay.style.opacity = String(Math.max(0, Math.min(1, opacity)));
    document.body?.classList.toggle("realism-flashed", remaining > 0);
  }

  function updateOpenRedDotAdsOverlay() {
    const open = document.querySelector(".scope-overlay.is-open");
    const hasOptic = !!getEquippedAttachmentBySlot("optic");
    document.body?.classList.toggle("realism-no-optic", !hasOptic);
    document.body?.classList.toggle("realism-ads-open", !!open && hasOptic);
    document.body?.classList.toggle("realism-ads-4x", !!open && isFourPowerScopeActive());
  }

  function enforceOpticAimState(game) {
    if (!game || getEquippedAttachmentBySlot("optic")) return;
    if (game.aimingDownSight) {
      game.aimingDownSight = false;
      setGameMessage(game, "裸枪没有瞄准镜");
    }
  }

  function normalizeWeaponDamage(game) {
    const weapon = game.weapon;
    const damage = getOutgoingBulletDamage();
    if (!weapon || weapon.__realismDamageValue === damage) return;
    for (const key of Object.keys(weapon)) {
      if (typeof weapon[key] === "number" && /damage/i.test(key)) weapon[key] = damage;
    }
    if (typeof weapon.damage === "number") weapon.damage = damage;
    weapon.__realismDamageValue = damage;
  }

  function installAwHeadshotHook(game) {
    if (!game || game.__realismAwHeadshotHooked || typeof game.createBullet !== "function") return;
    game.__realismAwHeadshotHooked = true;
    const nativeCreateBullet = game.createBullet;
    game.createBullet = function realismCreateBulletWithHeadshot(...args) {
      tryAwRedAmmoHeadshot(this);
      return nativeCreateBullet.apply(this, args);
    };
  }

  function tryAwRedAmmoHeadshot(game) {
    if (!game?.camera || !game.raycaster || game.session?.screen !== "playing" || game.session?.playerAlive === false) return;
    if (!isAwRedAmmoHeadshotReady()) return;
    const T = window.__FPS_THREE__;
    if (!T?.Vector3) return;
    const origin = new T.Vector3();
    const direction = new T.Vector3();
    game.camera.getWorldPosition(origin);
    game.camera.getWorldDirection(direction);
    game.raycaster.set(origin, direction);
    const targets = typeof game.getShootableTargetMeshes === "function" ? game.getShootableTargetMeshes() : [];
    const obstacles = typeof game.getObstacleMeshes === "function" ? game.getObstacleMeshes() : [];
    const hits = game.raycaster.intersectObjects([...targets, ...obstacles], false);
    for (const hit of hits) {
      if (isObstacleHit(game, hit.object)) return;
      const record = findEnemyRecordForObject(game, hit.object);
      if (!record) continue;
      if (record.enemy?.dead || record.enemy?.team === (game.session?.playerTeam || "blue")) return;
      if (!isHeadshotHit(hit, record)) return;
      applyAwRedAmmoHeadshot(game, record, hit.point);
      return;
    }
  }

  function isAwRedAmmoHeadshotReady(state = getEconomyState()) {
    const weapon = getEquippedWeaponDef(state);
    const ammoItem = getEquippedAmmoItem(state);
    const ammoDef = ammoItem ? getMarketDefinition(ammoItem.defId) : null;
    return weapon?.id === "gun-awm" && !!ammoDef?.headshotOneTap && Number(ammoItem?.remaining || 0) > 0;
  }

  function isObstacleHit(game, object) {
    if (!object) return false;
    if (typeof game?.isObstacleMesh === "function" && game.isObstacleMesh(object)) return true;
    const name = String(object.name || "").toLowerCase();
    return /arena-box|boundary-wall|cover|building|crate|platform|wall|barrel|pallet|sandbag/.test(name);
  }

  function findEnemyRecordForObject(game, object) {
    if (!object) return null;
    for (const record of game.enemyRecords || []) {
      const root = record.view?.root;
      if (root && isObjectInsideRoot(object, root)) return record;
    }
    return null;
  }

  function isObjectInsideRoot(object, root) {
    let node = object;
    while (node) {
      if (node === root) return true;
      node = node.parent;
    }
    return false;
  }

  function isHeadshotHit(hit, record) {
    const name = String(hit.object?.name || "").toLowerCase();
    if (/head|helmet|visor/.test(name)) return true;
    const baseY = Number(record.enemy?.position?.y || 0);
    const pointY = Number(hit.point?.y || 0);
    return pointY >= baseY + 1.32;
  }

  function applyAwRedAmmoHeadshot(game, record, point) {
    const key = `${record.enemy?.id || "enemy"}:${record.enemy?.team || "red"}`;
    record.__realismDamageState = {
      key,
      health: 0,
      nativeHealth: 0,
      hitFlash: Number(record.enemy?.hitFlash || 0)
    };
    record.__realismRespawnAt = Infinity;
    forceEnemyDown(record, game);
    game.createImpact?.(point);
    game.hud?.showHitMarker?.();
    setGameMessage(game, "AWM 红色弹爆头击倒");
  }

  function normalizeCombatDamage(game) {
    if (!game.session || game.session.screen === "menu") return;
    normalizePlayerDamage(game);
    normalizeEnemyDamage(game);
  }

  function normalizePlayerDamage(game) {
    if (!game.session) return;
    const now = Number(game.now || 0);
    if (game.__realismRaidFailure) return;
    const session = game.session;
    const state = game.__realismPlayerDamageState || {
      health: clampHealth(session.health, PLAYER_MAX_HEALTH),
      nativeHealth: clampHealth(session.health, PLAYER_MAX_HEALTH),
      damageFlash: Number(session.damageFlash || 0)
    };
    game.__realismPlayerDamageState = state;

    if (game.__realismPlayerRespawnAt) {
      if (now >= game.__realismPlayerRespawnAt) {
        const spawn = chooseSpawn(game.arena, "blue", 0);
        game.player?.reset?.(spawn, game.arena?.playerYaw ?? 0);
        game.__realismPlayerRespawnAt = 0;
        state.health = PLAYER_MAX_HEALTH;
        state.nativeHealth = PLAYER_MAX_HEALTH;
        state.damageFlash = 0;
      } else {
        writePlayerHealth(game, 0, false);
        return;
      }
    }

    const nativeHealth = clampHealth(session.health, PLAYER_MAX_HEALTH);
    const nativeFlash = Number(session.damageFlash || 0);
    const nativeSaysHit = nativeHealth < state.nativeHealth - 0.25 || nativeFlash > state.damageFlash + 0.08 || session.playerAlive === false;
    if (game.session.screen === "playing" && nativeSaysHit) {
      state.health = roundHealth(Math.max(0, state.health - getIncomingPlayerDamage()));
      if (state.health <= 0) {
        failRaidFromDeath(game, now);
        state.nativeHealth = 0;
        state.damageFlash = nativeFlash;
        return;
      }
    }

    writePlayerHealth(game, state.health, true);
    state.nativeHealth = state.health;
    state.damageFlash = nativeFlash;
  }

  function writePlayerHealth(game, health, alive) {
    const cleanHealth = roundHealth(clampHealth(health, PLAYER_MAX_HEALTH));
    game.session = {
      ...game.session,
      health: cleanHealth,
      armor: 0,
      maxArmor: 0,
      playerAlive: alive && cleanHealth > 0
    };
  }

  function applyDirectPlayerDamage(game, amount, reason = "受伤") {
    if (!game?.session || game.__realismRaidFailure || game.session.screen !== "playing") return;
    const damage = roundHealth(Math.max(0, Number(amount) || 0));
    if (!damage) return;
    const current = getCurrentPlayerHealth(game);
    const next = roundHealth(Math.max(0, current - damage));
    game.__realismPlayerDamageState = {
      ...(game.__realismPlayerDamageState || {}),
      health: next,
      nativeHealth: next,
      damageFlash: Math.max(0.7, Number(game.__realismPlayerDamageState?.damageFlash || 0))
    };
    if (next <= 0) {
      failRaidFromDeath(game, Number(game.now || 0));
      return;
    }
    writePlayerHealth(game, next, true);
    game.session.damageFlash = 1;
    setGameMessage(game, `${reason} -${Math.round(damage)} 血`);
  }

  function applyDirectEnemyDamage(game, record, amount, reason = "命中") {
    if (!record?.enemy || record.enemy.dead) return;
    const current = Number.isFinite(record.__realismDamageState?.health)
      ? record.__realismDamageState.health
      : clampHealth(record.enemy.health, PLAYER_MAX_HEALTH);
    const next = roundHealth(Math.max(0, current - Math.max(0, Number(amount) || 0)));
    record.__realismDamageState = {
      ...(record.__realismDamageState || {}),
      key: `${record.enemy.id || "enemy"}:${record.enemy.team || "red"}`,
      health: next,
      nativeHealth: next,
      hitFlash: 1
    };
    if (next <= 0) {
      record.__realismRespawnAt = Infinity;
      forceEnemyDown(record, game);
      game.hud?.showHitMarker?.();
      setGameMessage(game, `${reason}击倒目标`);
      return;
    }
    record.enemy = { ...record.enemy, health: next, hitFlash: 1 };
    record.view?.sync?.(record.enemy, game.player?.getPosition?.());
    game.hud?.showHitMarker?.();
  }

  function failRaidFromDeath(game, now = Number(game?.now || 0)) {
    if (!game || game.__realismRaidFailure) return;
    const lostCount = dropCarriedItemsOnDeath();
    game.__realismSearch = null;
    game.__realismExtraction = null;
    game.__realismPlayerRespawnAt = 0;
    game.__realismLoadoutOpen = false;
    game.__realismBackpackSelectedIndex = 0;
    game.__realismPlayerDamageState = { health: PLAYER_MAX_HEALTH, nativeHealth: PLAYER_MAX_HEALTH, damageFlash: 0 };
    game.__realismRaidFailure = {
      startedAt: now,
      returnAt: now + EXTRACT_ANIMATION_SECONDS,
      lostCount
    };
    game.session = {
      ...(game.session || {}),
      screen: "menu",
      winner: null,
      playerAlive: true,
      health: PLAYER_MAX_HEALTH,
      armor: 0,
      maxArmor: 0,
      remainingTime: MATCH_DURATION_SECONDS,
      matchDuration: MATCH_DURATION_SECONDS
    };
    setGameMessage(game, lostCount ? `撤离失败，丢失 ${lostCount} 件身上物品` : "撤离失败");
    document.body?.classList.add("realism-raid-failed");
    document.exitPointerLock?.();
    markDeltaUiDirty();
  }

  function dropCarriedItemsOnDeath() {
    const state = getEconomyState();
    const secure = new Set(state.secureContainer || []);
    const equippedUids = getEquippedItemUids(state);
    const remove = new Set();
    for (const uid of equippedUids) remove.add(uid);
    for (const item of state.inventory || []) {
      const def = getMarketDefinition(item.defId);
      if (def?.type === "loot" && item.location !== "secure" && !secure.has(item.uid)) remove.add(item.uid);
      if (def?.type === "tactical" && item.location === "carried" && !secure.has(item.uid)) remove.add(item.uid);
    }
    if (!remove.size) return 0;
    state.inventory = (state.inventory || []).filter((item) => !remove.has(item.uid));
    clearRemovedEquipment(state, remove);
    state.secureContainer = (state.secureContainer || []).filter((uid) => !remove.has(uid) && state.inventory.some((item) => item.uid === uid));
    if (state.pendingSale?.uid && remove.has(state.pendingSale.uid)) state.pendingSale = null;
    saveEconomyState(state);
    markDeltaUiDirty();
    return remove.size;
  }

  function getEquippedItemUids(state = getEconomyState()) {
    return [
      state.equipped?.weapon,
      state.equipped?.ammo,
      state.equipped?.chestRig,
      state.equipped?.helmet,
      state.equipped?.armor,
      state.equipped?.backpack,
      ...(state.equipped?.attachments || [])
    ].filter(Boolean);
  }

  function clearRemovedEquipment(state, removed) {
    state.equipped = { ...(state.equipped || {}) };
    for (const slot of ["weapon", "ammo", "chestRig", "helmet", "armor", "backpack"]) {
      if (removed.has(state.equipped[slot])) state.equipped[slot] = "";
    }
    state.equipped.attachments = (state.equipped.attachments || []).filter((uid) => !removed.has(uid));
  }

  function normalizeEnemyDamage(game) {
    const records = game.enemyRecords || [];
    for (let i = 0; i < records.length; i += 1) {
      const record = records[i];
      if (!record?.enemy || record.__realismRespawnAt) continue;
      const enemy = record.enemy;
      const key = `${enemy.id || i}:${enemy.team || "red"}`;
      if (!record.__realismDamageState || record.__realismDamageState.key !== key) {
        record.__realismDamageState = {
          key,
          health: clampHealth(enemy.health, PLAYER_MAX_HEALTH),
          nativeHealth: clampHealth(enemy.health, PLAYER_MAX_HEALTH),
          hitFlash: Number(enemy.hitFlash || 0)
        };
      }
      const state = record.__realismDamageState;
      const nativeHealth = clampHealth(enemy.health, PLAYER_MAX_HEALTH);
      const nativeFlash = Number(enemy.hitFlash || 0);
      const nativeSaysHit = nativeHealth < state.nativeHealth - 0.25 || nativeFlash > state.hitFlash + 0.08 || enemy.dead === true;
      if (nativeSaysHit) {
        state.health = roundHealth(Math.max(0, state.health - getOutgoingBulletDamage()));
      }
      if (state.health <= 0) {
        record.__realismRespawnAt = Infinity;
        forceEnemyDown(record, game);
        state.nativeHealth = 0;
        state.hitFlash = nativeFlash;
        continue;
      }
      record.enemy = {
        ...record.enemy,
        dead: false,
        health: state.health,
        respawnAt: 0
      };
      record.view?.sync?.(record.enemy, game.player?.getPosition?.());
      state.nativeHealth = state.health;
      state.hitFlash = nativeFlash;
    }
  }

  function clampHealth(value, maxHealth) {
    const number = Number.isFinite(value) ? value : maxHealth;
    return Math.max(0, Math.min(maxHealth, number));
  }

  function roundHealth(value) {
    return Math.round(value * 10) / 10;
  }

  function keepTroopsRefreshing(game) {
    if (!game.session || !game.arena || game.session.screen === "menu") return;
    normalizeCombatDamage(game);
    ensureFixedTeamSpawns(game);
    const now = Number(game.now || 0);
    const session = game.session;
    const startedAt = Number.isFinite(session.startedAt) ? session.startedAt : now;
    const elapsed = Math.max(0, now - startedAt);
    const remaining = Math.max(0, MATCH_DURATION_SECONDS - elapsed);
    const resetClock = remaining <= 0 || session.screen === "matchover";
    game.session = {
      ...game.session,
      screen: "playing",
      winner: null,
      scoreLimit: 999999,
      matchDuration: MATCH_DURATION_SECONDS,
      startedAt: resetClock ? now : startedAt,
      remainingTime: resetClock ? MATCH_DURATION_SECONDS : remaining,
      armor: 0,
      maxArmor: 0
    };

    const records = game.enemyRecords || [];
    for (let i = 0; i < records.length; i += 1) {
      const record = records[i];
      if (!record?.enemy) continue;
      getFixedSpawnForRecord(game, record, i);
      const dead = record.enemy.dead || (record.enemy.health || 0) <= 0;
      if (record.__realismRespawnAt) {
        if (now < record.__realismRespawnAt) {
          forceEnemyDown(record, game);
          continue;
        }
        respawnEnemyRecord(game, record, i);
        continue;
      }
      if (dead) {
        record.__realismRespawnAt = Infinity;
        forceEnemyDown(record, game);
      }
    }
  }

  function chooseSpawn(arena, team = "red", index = 0) {
    const teamSpawns = arena.teamSpawns?.[team] || arena.teamSpawns?.blue || arena.teamSpawns?.red;
    const list = teamSpawns?.length ? teamSpawns : arena.enemySpawns?.length ? arena.enemySpawns : [arena.playerSpawn || { x: 0, y: 0, z: 0 }];
    const base = list[Math.abs(index) % list.length] || { x: 0, y: 0, z: 0 };
    return cloneSpawn(base);
  }

  function ensureFixedTeamSpawns(game) {
    const arena = game.arena;
    if (!arena || arena.__realismFixedSpawnsDone) return;
    arena.__realismFixedSpawnsDone = true;
    if (getSelectedMap().id === "bridge") {
      arena.teamSpawns = {
        blue: [
          { x: -6, y: 0, z: 58 },
          { x: 6, y: 0, z: 58 },
          { x: -14, y: 0, z: 50 },
          { x: 14, y: 0, z: 50 },
          { x: -24, y: 0, z: 42 },
          { x: 24, y: 0, z: 42 },
          { x: -34, y: 0, z: 34 },
          { x: 34, y: 0, z: 34 }
        ],
        red: [
          { x: -6, y: 0, z: -58 },
          { x: 6, y: 0, z: -58 },
          { x: -14, y: 0, z: -50 },
          { x: 14, y: 0, z: -50 },
          { x: -24, y: 0, z: -42 },
          { x: 24, y: 0, z: -42 },
          { x: -34, y: 0, z: -34 },
          { x: 34, y: 0, z: -34 }
        ]
      };
      arena.enemySpawns = arena.teamSpawns.red.map(cloneSpawn);
      arena.playerSpawn = cloneSpawn(arena.teamSpawns.blue[0]);
      arena.playerYaw = Math.PI;
      game.__realismSpawns = arena.teamSpawns;
      return;
    }
    const limit = Math.max(52, Math.min(64, (arena.size || arena.width || arena.depth || 120) * 0.42));
    const side = Math.max(18, Math.min(28, limit * 0.45));
    const lane = Math.max(36, limit - 12);
    arena.teamSpawns = {
      blue: [
        { x: -side, y: 0, z: lane },
        { x: -side - 6, y: 0, z: lane - 6 },
        { x: -side + 6, y: 0, z: lane - 8 },
        { x: -side - 12, y: 0, z: lane - 2 }
      ],
      red: [
        { x: side, y: 0, z: -lane },
        { x: side + 6, y: 0, z: -lane + 6 },
        { x: side - 6, y: 0, z: -lane + 8 },
        { x: side + 12, y: 0, z: -lane + 2 }
      ]
    };
    arena.enemySpawns = arena.teamSpawns.red.map(cloneSpawn);
    arena.playerSpawn = cloneSpawn(arena.teamSpawns.blue[0]);
    arena.playerYaw = 0;
    game.__realismSpawns = arena.teamSpawns;
  }

  function configureRaidCombat(game) {
    if (!game?.enemyRecords?.length || !game.arena) return;
    ensureFixedTeamSpawns(game);
    ensureSelectedMapPlayerSpawn(game);
    game.session = {
      ...game.session,
      playerTeam: "blue",
      scoreLimit: 999999,
      winner: null
    };
    for (let i = 0; i < game.enemyRecords.length; i += 1) {
      const record = game.enemyRecords[i];
      if (!record?.enemy) continue;
      if (!record.__realismRaidConfigured) {
        const spawn = chooseSpawn(game.arena, "red", i);
        record.__realismRaidConfigured = true;
        record.enemy = {
          ...record.enemy,
          team: "red",
          name: record.enemy.team === "blue" ? `巡逻小兵 ${i + 1}` : record.enemy.name,
          position: cloneSpawn(spawn),
          dead: false,
          health: PLAYER_MAX_HEALTH,
          respawnAt: 0
        };
        record.__realismDamageState = {
          key: `${record.enemy.id || i}:red`,
          health: PLAYER_MAX_HEALTH,
          nativeHealth: PLAYER_MAX_HEALTH,
          hitFlash: 0
        };
        record.view?.sync?.(record.enemy, game.player?.getPosition?.());
      }
    }
  }

  function ensureSelectedMapPlayerSpawn(game) {
    if (game.session?.screen !== "playing" || !game?.arena?.playerSpawn || game.__realismPlayerSpawnAppliedForArena === game.arena) return;
    const spawn = cloneSpawn(game.arena.playerSpawn);
    const yaw = Number.isFinite(game.arena.playerYaw) ? game.arena.playerYaw : Number(game.session?.playerYaw || 0);
    game.session = {
      ...game.session,
      playerSpawn: cloneSpawn(spawn),
      playerYaw: yaw
    };
    game.player?.reset?.(spawn, yaw);
    game.__realismPlayerSpawnAppliedForArena = game.arena;
  }

  function ensureExtraBridgeSoldiers(game, T) {
    if (!game?.arena || getSelectedMap().id !== "bridge" || game.selectedMode === "lan" || game.session?.screen !== "playing") return;
    if (!game.enemyRecords?.length || game.__realismBridgeSoldiersDoneForArena === game.arena) return;
    ensureFixedTeamSpawns(game);
    const template = game.enemyRecords.find((record) => record?.view?.root && record.enemy);
    if (!template) return;
    const targetRed = 12;
    const targetBlue = 8;
    const existing = (team) => game.enemyRecords.filter((record) => record.enemy?.team === team).length;
    while (existing("red") < targetRed) {
      addExtraBridgeSoldier(game, T, template, "red", existing("red"));
    }
    while (existing("blue") < targetBlue) {
      addExtraBridgeSoldier(game, T, template, "blue", existing("blue"));
    }
    game.__realismBridgeSoldiersDoneForArena = game.arena;
  }

  function addExtraBridgeSoldier(game, T, template, team, index) {
    const spawn = chooseSpawn(game.arena, team, index);
    const id = `bridge-${team}-${index + 1}`;
    const enemy = {
      ...(template.enemy || {}),
      id,
      name: team === "blue" ? `我方突击兵 ${index + 1}` : `桥头守军 ${index + 1}`,
      team,
      position: cloneSpawn(spawn),
      dead: false,
      health: PLAYER_MAX_HEALTH,
      respawnAt: 0,
      hitFlash: 0,
      firingFlash: 0,
      state: team === "blue" ? "advance" : "guard"
    };
    const view = cloneEnemyViewForExtraSoldier(game, T, template.view, enemy);
    const record = {
      ...template,
      enemy,
      view,
      spawnIndex: index,
      isLanRemote: false,
      __realismExtraBridgeSoldier: true,
      __realismRaidConfigured: true,
      __realismFixedSpawn: cloneSpawn(spawn),
      __realismFixedSpawnTeam: team,
      __realismDamageState: {
        key: `${id}:${team}`,
        health: PLAYER_MAX_HEALTH,
        nativeHealth: PLAYER_MAX_HEALTH,
        hitFlash: 0
      }
    };
    game.enemyRecords.push(record);
    view.sync(enemy, game.player?.getPosition?.());
  }

  function cloneEnemyViewForExtraSoldier(game, T, sourceView, enemy) {
    const root = sourceView.root.clone(true);
    root.name = `Enemy ${enemy.id}`;
    root.userData = { ...(root.userData || {}), enemyId: enemy.id, team: enemy.team };
    root.traverse((child) => {
      child.userData = { ...(child.userData || {}), enemyId: enemy.id, team: enemy.team };
      if (child.isMesh) {
        child.material = Array.isArray(child.material)
          ? child.material.map((mat) => mat.clone?.() || mat)
          : child.material?.clone?.() || child.material;
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    game.scene.add(root);
    return {
      root,
      sync(nextEnemy, playerPosition) {
        const position = nextEnemy.position || { x: 0, y: 0, z: 0 };
        root.position.set(position.x || 0, position.y || 0, position.z || 0);
        if (playerPosition) root.lookAt(playerPosition.x || 0, root.position.y, playerPosition.z || 0);
        root.visible = !nextEnemy.dead;
        const flash = Number(nextEnemy.hitFlash || 0);
        root.traverse((child) => {
          if (!child.isMesh || !child.material) return;
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          for (const material of materials) {
            if (!material?.emissive) continue;
            if (flash > 0) {
              material.emissive.setHex?.(0xffffff);
              material.emissiveIntensity = 0.45;
            } else if (material.emissiveIntensity > 0.25) {
              material.emissiveIntensity = 0.08;
            }
          }
        });
      },
      dispose() {
        root.parent?.remove(root);
        root.traverse((child) => {
          if (!child.isMesh || !child.material) return;
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          for (const material of materials) material?.dispose?.();
        });
      }
    };
  }

  function getFixedSpawnForRecord(game, record, index) {
    ensureFixedTeamSpawns(game);
    const team = record.enemy?.team || "red";
    if (!record.__realismFixedSpawn || record.__realismFixedSpawnTeam !== team) {
      const list = game.arena?.teamSpawns?.[team] || game.arena?.teamSpawns?.red || game.arena?.teamSpawns?.blue || [];
      const slot = Number.isFinite(record.spawnIndex) ? record.spawnIndex : index;
      record.spawnIndex = Math.abs(slot) % Math.max(1, list.length);
      record.__realismFixedSpawn = cloneSpawn(list[record.spawnIndex] || chooseSpawn(game.arena, team, index));
      record.__realismFixedSpawnTeam = team;
    }
    return cloneSpawn(record.__realismFixedSpawn);
  }

  function forceEnemyDown(record, game) {
    record.enemy = {
      ...record.enemy,
      dead: true,
      health: 0,
      respawnAt: record.__realismRespawnAt || 0,
      state: "downed"
    };
    record.view?.sync?.(record.enemy, game.player?.getPosition?.());
  }

  function respawnEnemyRecord(game, record, index) {
    const spawn = getFixedSpawnForRecord(game, record, index);
    record.__realismRespawnAt = 0;
    record.__realismDamageState = {
      key: `${record.enemy?.id || index}:${record.enemy?.team || "red"}`,
      health: PLAYER_MAX_HEALTH,
      nativeHealth: PLAYER_MAX_HEALTH,
      hitFlash: 0
    };
    record.enemy = {
      ...record.enemy,
      dead: false,
      health: 100,
      respawnAt: 0,
      hitFlash: 0,
      firingFlash: 0,
      state: "patrol",
      position: cloneSpawn(spawn)
    };
    record.view?.sync?.(record.enemy, game.player?.getPosition?.());
  }

  function cloneSpawn(point) {
    return { x: point?.x || 0, y: point?.y || 0, z: point?.z || 0 };
  }

  function installDoorControls(game) {
    if (game.__realismDoorControlsInstalled) return;
    game.__realismDoorControlsInstalled = true;
    game.__realismDoorKeyHandler = (event) => {
      if (event.repeat || !event.key || event.key.toLowerCase() !== "z") return;
      const door = findNearestDoor(game);
      if (!door) {
        game.message = "靠近店门再按 Z";
        return;
      }
      door.userData.open = !door.userData.open;
      door.userData.targetAngle = door.userData.open ? door.userData.openAngle : door.userData.closedAngle;
      game.message = door.userData.open ? "门已打开" : "门已关闭";
    };
    window.addEventListener("keydown", game.__realismDoorKeyHandler);
  }

  function updateInteractiveDoors(game) {
    if (game.arena?.group?.__realismDoors) game.__realismDoors = game.arena.group.__realismDoors;
    for (const door of game.__realismDoors || []) {
      const target = door.userData?.targetAngle || 0;
      door.rotation.y += (target - door.rotation.y) * 0.22;
    }
  }

  function findNearestDoor(game) {
    const player = game.player?.getPosition?.() || game.camera?.position;
    if (!player) return null;
    let best = null;
    let bestDistance = Infinity;
    for (const door of game.__realismDoors || []) {
      const x = door.userData?.interactX ?? door.position.x;
      const z = door.userData?.interactZ ?? door.position.z;
      const distance = Math.hypot((player.x || 0) - x, (player.z || 0) - z);
      if (distance < bestDistance) {
        best = door;
        bestDistance = distance;
      }
    }
    return bestDistance <= DOOR_INTERACT_DISTANCE ? best : null;
  }

    installDeltaInterfaceStyles();
    if (document.getElementById("realism-delta-ui")) return;
    const root = document.createElement("div");
    root.id = "realism-delta-ui";
    root.dataset.tab = "deploy";
    root.dataset.dirty = "1";
    root.addEventListener("click", (event) => handleDeltaUiClick(event, game));
    root.addEventListener("wheel", handleDeltaUiWheel, { passive: false });
    document.body.appendChild(root);
    renderDeltaInterface(game);
  }

  function updateDeltaInterface(game) {
    installDeltaInterface(game);
    const root = document.getElementById("realism-delta-ui");
    if (!root) return;
    const menuActive = !game.session || game.session.screen === "menu";
    root.classList.toggle("is-visible", menuActive);
    document.body?.classList.toggle("realism-menu-active", menuActive);
    if (!menuActive) return;
    const now = Date.now();
    const state = getEconomyState();
    const timedRefresh = root.dataset.tab === "exchange" && !!state.pendingSale?.uid;
    if (root.dataset.dirty === "1" || (timedRefresh && now - Number(root.dataset.renderedAt || 0) > 900)) renderDeltaInterface(game);
  }

  function renderDeltaInterface(game) {
    const root = document.getElementById("realism-delta-ui");
    if (!root) return;
    const state = getEconomyState();
    const tab = normalizeTab(root.dataset.tab || state.selectedTab || "deploy");
    root.dataset.tab = tab;
    const operator = getSelectedOperator(state);
    const protection = calculatePlayerProtection(state);
    root.innerHTML = `
      <div class="delta-shell">
        <header class="delta-topbar">
          <div class="delta-brand">
            <span class="delta-mark"></span>
            <div>
              <strong>行动中心</strong>
              <small>地图 / 仓库 / 黑市 / 交易行</small>
            </div>
          </div>
          <nav class="delta-tabs">
            ${renderTabButton("deploy", "主页", tab)}
            ${renderTabButton("warehouse", "仓库", tab)}
            ${renderTabButton("operators", "特战干员", tab)}
            ${renderTabButton("market", "黑市", tab)}
            ${renderTabButton("exchange", "交易行", tab)}
          </nav>
          <div class="delta-wallet">
            <span>游戏币</span>
            <strong>${formatCoins(state.coins)}</strong>
          </div>
        </header>
        <main class="delta-body">
          <section class="delta-page">
            ${renderDeltaTab(tab, state, operator, protection, game)}
          </section>
        </main>
      </div>
    `;
    root.dataset.dirty = "0";
    root.dataset.renderedAt = String(Date.now());
  }

  function renderTabButton(id, label, activeTab) {
    return `<button type="button" class="${activeTab === id ? "is-active" : ""}" data-ui-tab="${id}">${label}</button>`;
  }

  function renderDeltaTab(tab, state, operator, protection, game) {
    if (tab === "warehouse") return renderWarehouseTab(state, protection);
    if (tab === "operators") return renderOperatorsTab(state);
    if (tab === "market") return renderMarketTab(state);
    if (tab === "exchange") return renderExchangeTab(state);
    return renderDeployTab(state, operator, protection, game);
  }

    const outgoingDamage = getOutgoingBulletDamage(state);
    const selectedMap = getSelectedMap(state);
    const deployMode = normalizeDeployMode(state.deployMode || "raid");
    const inviteCode = getActiveInviteCode(state);
    return `
      <div class="delta-home">
        ${deployMode === "multi" && state.multiplayerRole === "host" && inviteCode ? renderInviteBadge(inviteCode) : ""}

          <div class="delta-operator-portrait"></div>
          <div class="delta-operator-meta">
            <div class="delta-tag-row">
              <span class="delta-tag">${escapeHtml(operator.role)}</span>
              <span class="delta-tag">${escapeHtml(operator.name)}</span>
            </div>
            <strong>${escapeHtml(operator.name)}</strong>
            <p>${escapeHtml(operator.trait)}</p>
          </div>
        </div>
        <div class="delta-panel">
          <div class="delta-raid-brief">
            <span>烽火地带</span>

                <span>${escapeHtml(map.terrain)}</span>

          <div class="delta-mode-grid">
            <button type="button" class="delta-mode-card ${deployMode === "raid" ? "is-selected" : ""}" data-action="select-mode" data-mode-id="raid">
              <strong>单人突袭</strong>
              <span>搜索、撤离、小兵战斗</span>

            <button type="button" class="delta-mode-card ${deployMode === "multi" ? "is-selected" : ""}" data-action="select-mode" data-mode-id="multi">

            <button type="button" data-ui-tab="exchange">交易行</button>
            <button type="button" data-ui-tab="operators">特战干员</button>

          <div class="delta-note">战斗中按 E 使用技能，按 L 搜索容器，搜索界面用方向键选物品，按 M 拾取，按 N 关闭；Q 回血，X 迅捷。</div>

          <span>${deployMode === "multi" ? `多人游戏${inviteCode ? `：${escapeHtml(inviteCode)}` : ""}` : `当前地图：${escapeHtml(selectedMap.name)}`}</span>

  function handleDeltaUiClick(event, game) {
    const target = event.target.closest("button[data-ui-tab], button[data-action], button[data-market-category]");
    if (!target || !target.closest("#realism-delta-ui")) return;
    event.preventDefault();
    if (target.dataset.marketCategory) {
      const state = getEconomyState();
      state.marketCategory = normalizeMarketCategory(target.dataset.marketCategory);
      saveEconomyState(state);
      markDeltaUiDirty();
      renderDeltaInterface(game);
      return;
    }
    const tab = target.dataset.uiTab;
    const root = document.getElementById("realism-delta-ui");
    if (tab) {
      const state = getEconomyState();
      root.dataset.tab = normalizeTab(tab);
      state.selectedTab = root.dataset.tab;
      saveEconomyState(state);
      markDeltaUiDirty();
      renderDeltaInterface(game);
      return;
    }

    const action = target.dataset.action;
    if (action === "start") {
      const state = getEconomyState();
      syncNativeOperatorSelection(state);
      applyEquippedWeapon(game, true);
      if (normalizeDeployMode(state.deployMode) === "multi" && !prepareMultiplayerStart(game, state)) return;
      clickNativeStartButton(game, state.deployMode);
      return;
    }
    if (action === "select-map") selectRaidMap(target.dataset.mapId, game);
    if (action === "select-mode") selectDeployMode(target.dataset.modeId, game);
    if (action === "select-multi-role") selectMultiplayerRole(target.dataset.roleId, game);
    if (action === "create-room") createMultiplayerRoom(game);
    if (action === "join-invite") joinMultiplayerInvite(game);
    if (action === "buy") buyMarketItem(target.dataset.itemId, game);
    if (action === "sell-loot") startSellLootItem(target.dataset.itemUid, game);
    if (action === "sell-warehouse") sellWarehouseItem(target.dataset.itemUid, game);
    if (action === "select-operator") selectOperator(target.dataset.operatorId, game);
    if (action === "carry-tactical") carryTacticalItem(target.dataset.itemUid, game);
    if (action === "equip-item") equipInventoryItem(target.dataset.itemUid, game);
    if (action === "unequip-item") unequipInventoryItem(target.dataset.itemUid, game);
    if (action === "secure-item") moveItemToSecureContainer(target.dataset.itemUid, game);
    if (action === "unsecure-item") moveItemFromSecureContainer(target.dataset.itemUid, game);
    if (action === "use-medicine") useMedicineItem(target.dataset.itemUid, game);
    renderDeltaInterface(game);
  }

  function handleDeltaUiWheel(event) {
    const root = document.getElementById("realism-delta-ui");
    if (!root?.classList.contains("is-visible")) return;
    const target = event.target;
    const focusedScroller = target?.closest?.(".delta-inventory-scroll");
    const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
    const bodyScroller = target?.closest?.(".delta-body") || root.querySelector(".delta-body");
    const scrollers = [focusedScroller, bodyScroller].filter(Boolean);
    for (const scroller of scrollers) {
      if (scrollElementByDelta(scroller, delta)) {
        event.preventDefault();
        event.stopPropagation();
        return;
      }
    }
  }

  function scrollElementByDelta(scroller, delta) {
    const maxTop = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
    if (maxTop <= 0) return false;
    const before = scroller.scrollTop;
    const next = Math.max(0, Math.min(maxTop, before + delta));
    if (next === before) return false;
    scroller.scrollTop = next;
    return scroller.scrollTop !== before;
  }

  function renderSecureContainerSlots(items) {
    const slots = [];

      const item = items[i];

        slots.push(`<div class="realism-loadout-item is-empty"><span>加密箱格 ${i + 1}</span><strong>空</strong><span>可保护带出</span></div>`);
        continue;
      }
      const def = getMarketDefinition(item.defId);
      const style = def?.color ? `style="border-color: ${def.color};"` : "";
      slots.push(`
        <div class="realism-loadout-item" ${style}>

          <strong>${escapeHtml(def?.name || "未知物品")}</strong>

    return slots.join("");

    const items = getBackpackLootItems(state);
    if (!items.length) {
      game.__realismBackpackSelectedIndex = -1;
      return;
    }
    const index = Number.isFinite(game.__realismBackpackSelectedIndex) ? game.__realismBackpackSelectedIndex : 0;
    game.__realismBackpackSelectedIndex = Math.max(0, Math.min(items.length - 1, index));
  }

    if (!game?.session || game.session.screen !== "playing") {
      setGameMessage(game, "进入战斗后才能查看配装");
      return;

    game.__realismLoadoutOpen = !game.__realismLoadoutOpen;
    if (game.__realismLoadoutOpen) {
      normalizeBackpackSelection(game);
      setGameMessage(game, "已打开配装");
    } else {
      setGameMessage(game, "已关闭配装");
    }
  }

  function moveBackpackSelection(game, key) {
    if (!game.__realismLoadoutOpen) return false;
    const items = getBackpackLootItems();
    if (!items.length) {
      game.__realismBackpackSelectedIndex = -1;
      setGameMessage(game, "背包里没有可选择物品");
      return true;
    }
    normalizeBackpackSelection(game);
    const columns = 3;
    const current = Number.isFinite(game.__realismBackpackSelectedIndex) ? game.__realismBackpackSelectedIndex : 0;
    const step = key === "ArrowLeft" ? -1 : key === "ArrowRight" ? 1 : key === "ArrowUp" ? -columns : columns;
    const next = (current + step + items.length) % items.length;
    game.__realismBackpackSelectedIndex = next;
    const def = getMarketDefinition(items[next]?.defId);
    if (def) setGameMessage(game, `背包选中：${def.name}`);
    return true;
  }

  function discardSelectedBackpackItem(game) {
    if (!game.__realismLoadoutOpen) return false;
    const state = getEconomyState();
    const items = getBackpackLootItems(state);
    if (!items.length) {
      setGameMessage(game, "背包里没有可丢弃物品");
      return true;
    }
    normalizeBackpackSelection(game, state);
    const index = Number.isFinite(game.__realismBackpackSelectedIndex) ? game.__realismBackpackSelectedIndex : 0;
    const item = items[index];
    const def = getMarketDefinition(item?.defId);
    if (!item || !def) return true;
    state.inventory = (state.inventory || []).filter((entry) => entry.uid !== item.uid);
    if (state.pendingSale?.uid === item.uid) state.pendingSale = null;
    saveEconomyState(state);
    game.__realismBackpackSelectedIndex = Math.min(index, Math.max(0, getBackpackLootItems(state).length - 1));
    setGameMessage(game, `已丢弃：${def.name}`);
    markDeltaUiDirty();
    return true;
  }

  function secureSelectedBackpackItem(game) {
    if (!game.__realismLoadoutOpen) return false;
    const state = getEconomyState();
    const items = getBackpackLootItems(state);
    if (!items.length) {
      setGameMessage(game, "背包里没有可放入加密箱的物品");
      return true;
    }
    if (getSecureContainerItems(state).length >= SECURE_CONTAINER_CAPACITY) {
      setGameMessage(game, "加密箱已满");
      return true;
    }
    normalizeBackpackSelection(game, state);
    const index = Number.isFinite(game.__realismBackpackSelectedIndex) ? game.__realismBackpackSelectedIndex : 0;
    const item = items[index];
    const def = getMarketDefinition(item?.defId);
    if (!item || !def) return true;
    state.secureContainer = Array.isArray(state.secureContainer) ? state.secureContainer : [];
    if (!state.secureContainer.includes(item.uid)) state.secureContainer.push(item.uid);
    item.location = "secure";
    saveEconomyState(state);
    game.__realismBackpackSelectedIndex = Math.min(index, Math.max(0, getBackpackLootItems(state).length - 1));
    setGameMessage(game, `已放入加密箱：${def.name}`);
    markDeltaUiDirty();
    return true;
  }

  function updateSearchProgress(game) {
    installSearchHud();
    const panel = document.getElementById("realism-search-panel");
    const search = game.__realismSearch;
    if (!panel) return;
    if (!search) {
      panel.classList.remove("is-visible");
      return;
    }
    const now = Number(game.now || 0);
    const total = Math.max(0.5, search.doneAt - search.startedAt);
    const progress = Math.max(0, Math.min(1, (now - search.startedAt) / total));
    if (progress >= 1) search.revealed = true;
    panel.classList.add("is-visible");
    panel.innerHTML = renderSearchInterface(search, progress);
  }

  function updateExtractionZone(game, T) {
    installExtractionHud();
    updateExtractionSmoke(game);
    const panel = document.getElementById("realism-extract-panel");
    const zone = game.arena?.group?.__realismExtractionZone;
    if (!panel || !zone) return;
    const now = Number(game.now || 0);
    const extraction = game.__realismExtraction || {};
    if (extraction.completed) {
      writePlayerHealth(game, PLAYER_MAX_HEALTH, true);
      panel.classList.remove("is-visible");
      document.body?.classList.add("realism-extracting");
      if (now >= Number(extraction.returnAt || 0)) finishExtraction(game);
      return;
    }
    if (game.session?.screen !== "playing") {
      panel.classList.remove("is-visible");
      document.body?.classList.remove("realism-extracting");
      game.__realismExtraction = null;
      return;
    }
    const player = game.player?.getPosition?.() || game.camera?.position;
    if (!player) return;
    const distance = Math.hypot((player.x || 0) - zone.x, (player.z || 0) - zone.z);
    const inside = distance <= zone.radius;
    if (!inside) {
      game.__realismExtraction = null;
      panel.classList.remove("is-visible");
      return;
    }
    const startedAt = Number.isFinite(extraction.startedAt) ? extraction.startedAt : now;
    const progress = Math.max(0, Math.min(1, (now - startedAt) / EXTRACT_HOLD_SECONDS));
    game.__realismExtraction = { startedAt, progress };
    panel.classList.add("is-visible");
    panel.innerHTML = `
      <strong>正在撤离</strong>
      <span>留在绿色烟雾圈内 ${Math.ceil(Math.max(0, EXTRACT_HOLD_SECONDS - (now - startedAt)))} 秒</span>
      <div class="realism-extract-track"><div class="realism-extract-fill" style="width:${Math.round(progress * 100)}%;"></div></div>
    `;
    if (progress >= 1) completeExtraction(game, now);
  }

  function completeExtraction(game, now) {
    game.__realismExtraction = {
      completed: true,
      returnAt: now + EXTRACT_ANIMATION_SECONDS
    };
    setGameMessage(game, "撤离成功");
    document.body?.classList.add("realism-extracting");
    document.exitPointerLock?.();
  }

  function finishExtraction(game) {
    game.__realismExtraction = null;
    document.body?.classList.remove("realism-extracting");
    game.session = {
      ...(game.session || {}),
      screen: "menu",
      winner: null,
      playerAlive: true,
      remainingTime: MATCH_DURATION_SECONDS,
      matchDuration: MATCH_DURATION_SECONDS
    };
    setGameMessage(game, "已撤离，物资保留");
    markDeltaUiDirty();
    renderDeltaInterface(game);
  }

  function updateRaidFailureHud(game) {
    installRaidFailureHud();
    const failure = game.__realismRaidFailure;
    if (!failure) {
      document.body?.classList.remove("realism-raid-failed");
      return;
    }
    const panel = document.getElementById("realism-raid-fail-cinematic");
    if (panel) {
      const lost = Number(failure.lostCount || 0);
      panel.innerHTML = `<div class="realism-extract-card"><strong>撤离失败</strong><span>${lost ? `丢失 ${lost} 件身上物品；仓库和加密箱物品保留` : "仓库和加密箱物品保留"}</span></div>`;
    }
    document.body?.classList.add("realism-raid-failed");
    if (Number(game.now || 0) < Number(failure.returnAt || 0)) return;
    game.__realismRaidFailure = null;
    document.body?.classList.remove("realism-raid-failed");
    renderDeltaInterface(game);
  }

  function updateExtractionSmoke(game) {
    const zone = game.arena?.group?.__realismExtractionZone;
    if (!zone?.smoke?.length) return;
    const now = Number(game.now || 0);
    for (const smoke of zone.smoke) {
      const phase = Number(smoke.userData?.phase || 0);
      const wave = (Math.sin(now * 1.8 + phase) + 1) * 0.5;
      smoke.position.y = Number(smoke.userData?.baseY || 0.8) + wave * 0.42;
      smoke.scale.setScalar(0.85 + wave * 0.55);
      if (smoke.material) smoke.material.opacity = 0.12 + wave * 0.16;
    }
  }

  function getRoundRemainingSeconds(game) {
    const session = game?.session || {};
    if (Number.isFinite(session.remainingTime)) return Math.max(0, Number(session.remainingTime));
    const now = Number(game?.now || 0);
    const startedAt = Number.isFinite(session.startedAt) ? session.startedAt : now;
    return Math.max(0, MATCH_DURATION_SECONDS - Math.max(0, now - startedAt));
  }

  function formatRoundTime(game) {
    const seconds = Math.ceil(getRoundRemainingSeconds(game));
    const minutes = Math.floor(seconds / 60);
    return `${minutes}:${String(seconds % 60).padStart(2, "0")}`;
  }

  function renderSearchInterface(search, progress) {
    const ready = !!search.revealed;
    const items = Array.isArray(search.items) ? search.items : [];
    const claimed = new Set(search.claimedUids || []);
    const slotCount = Math.max(SEARCH_GRID_SLOTS, Math.ceil(items.length / 3) * 3);
    const remaining = items.filter((item) => item && !claimed.has(item.uid)).length;
    if (ready) normalizeSearchSelection(search);
    const selectedIndex = Number.isFinite(search.selectedIndex) ? search.selectedIndex : -1;
    const slots = Array.from({ length: slotCount }, (_, index) => renderSearchLootSlot(items[index], ready, claimed, index === selectedIndex, index));
    return `
      <div class="realism-search-head">
        <span class="realism-search-glass"></span>
        <div>
          <strong>${escapeHtml(search.label || "搜索物资")}</strong>
          <span>${ready ? `发现 ${items.length} 件物品，剩余 ${remaining} 件可拿取` : `正在扫描物资 ${Math.round(progress * 100)}%`}</span>
        </div>
        <span>${ready ? "M 拾取 / B 加密 / N 关闭" : "搜索中"}</span>
      </div>
      <div class="realism-search-track"><div class="realism-search-fill" style="width:${Math.round(progress * 100)}%;"></div></div>
      <div class="realism-search-layout">
        <div class="realism-search-side">
          <strong>${escapeHtml(search.container?.userData?.label || "容器")}</strong>
          <span>${ready ? "方向键切换白圈选中的物品，按 M 拾取，按 B 放入加密箱。" : "放大镜完成扫描后，物品会在右侧格子里展开。"}</span>
          <span>按 L 搜索附近容器</span>
          <span>按 N 关闭搜索界面</span>
        </div>
        <div>
          <div class="realism-search-grid">${slots.join("")}</div>
          <div class="realism-search-actions">
            <button type="button" data-search-action="take-selected" ${ready && remaining ? "" : "disabled"}>拾取选中 (M)</button>
            <button type="button" data-search-action="take-all" ${ready && remaining ? "" : "disabled"}>全部拿取</button>
            <button type="button" data-search-action="close">关闭 (N)</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderSearchLootSlot(item, ready, claimed, selected, index) {
    if (!item) {
      return `<div class="realism-loot-slot is-empty"><span>空格</span><strong>无物品</strong><span>没有发现</span><button type="button" disabled>空</button></div>`;
    }
    const def = getMarketDefinition(item.defId);
    if (!ready) {
      return `<div class="realism-loot-slot is-scanning"><span>扫描中</span><strong>未知物品</strong><span><span class="realism-search-glass"></span>正在识别</span><button type="button" disabled>等待</button></div>`;
    }
    const isClaimed = claimed.has(item.uid);
    const tierStyle = def?.color ? `style="border-color: ${def.color};"` : "";
    return `
      <div class="realism-loot-slot ${isClaimed ? "is-taken" : ""} ${selected && !isClaimed ? "is-selected" : ""}" data-search-index="${index}" ${tierStyle}>
        <span>${escapeHtml(def?.meta || "变卖物")}</span>
        <strong>${escapeHtml(def?.name || "未知物品")}</strong>
        <span>价值 ${formatCoins(def?.value || 0)}</span>
        <button type="button" data-search-action="take-one" data-item-uid="${escapeHtml(item.uid)}" ${isClaimed ? "disabled" : ""}>${isClaimed ? "已拿取" : selected ? "M 拾取 / B 加密" : "拿取"}</button>
      </div>
    `;
  }

  function handleSearchPanelClick(event, game) {
    const button = event.target?.closest?.("button[data-search-action]");
    if (!button || !button.closest("#realism-search-panel")) return;
    event.preventDefault();
    event.stopPropagation();
    const action = button.dataset.searchAction;
    if (action === "take-one") claimSearchItem(game, button.dataset.itemUid);
    if (action === "take-selected") claimSelectedSearchItem(game);
    if (action === "take-all") claimAllSearchItems(game);
    if (action === "close") closeSearchInterface(game);
  }

  function searchNearestContainer(game) {
    if (!game?.session || game.session.screen !== "playing") {
      setGameMessage(game, "进入地图后才能搜索");
      return;
    }
    if (game.__realismSearch) {
      setGameMessage(game, "正在搜索中");
      return;
    }
    const container = findNearestLootContainer(game);
    if (!container) {
      setGameMessage(game, "靠近可搜索容器再按 L");
      return;
    }
    if (container.userData?.searched) {
      setGameMessage(game, "这个容器已经搜索过");
      return;
    }
    if (container.userData?.searchCache) {
      reopenSearchContainer(game, container);
      return;
    }
    const items = generateContainerLoot(container);
    const duration = Math.max(0.5, ...items.map((item) => getMarketDefinition(item.defId)?.scanTime || 0.5));
    game.__realismSearch = {
      container,
      items,
      claimedUids: [],
      revealed: false,
      selectedIndex: -1,
      label: `搜索 ${container.userData?.label || "容器"}`,
      startedAt: Number(game.now || 0),
      doneAt: Number(game.now || 0) + duration
    };
    setGameMessage(game, `正在搜索 ${container.userData?.label || "容器"}`);
  }

  function claimSearchItem(game, uid) {
    const search = game.__realismSearch;
    if (!search?.revealed || !uid) return;
    const claimed = new Set(search.claimedUids || []);
    if (claimed.has(uid)) return;
    const item = search.items?.find((entry) => entry.uid === uid);
    if (!item) return;
    const claimedIndex = (search.items || []).findIndex((entry) => entry?.uid === uid);
    const state = getEconomyState();
    if (getBackpackFreeSlots(state) <= 0) {
      setGameMessage(game, "背包已满，先撤离或清理变卖物");
      return;
    }
    state.inventory.push({ ...item, location: "backpack" });
    saveEconomyState(state);
    claimed.add(uid);
    search.claimedUids = [...claimed];
    const def = getMarketDefinition(item.defId);
    setGameMessage(game, `拿取：${def?.name || "物资"}`);
    selectNextSearchItem(search, claimedIndex);
    finishSearchIfEmpty(game);
    markDeltaUiDirty();
  }

  function claimSelectedSearchItem(game) {
    const search = game.__realismSearch;
    if (!search) return;
    if (!search.revealed) {
      setGameMessage(game, "还在扫描，等物品显示后再按 M");
      return;
    }
    normalizeSearchSelection(search);
    const index = Number.isFinite(search.selectedIndex) ? search.selectedIndex : -1;
    const item = index >= 0 ? search.items?.[index] : null;
    if (!item) {
      setGameMessage(game, "没有可拾取物品");
      return;
    }
    claimSearchItem(game, item.uid);
  }

  function secureSelectedSearchItem(game) {
    const search = game.__realismSearch;
    if (!search) return false;
    if (!search.revealed) {
      setGameMessage(game, "还在扫描，等物品显示后再按 B");
      return true;
    }
    normalizeSearchSelection(search);
    const index = Number.isFinite(search.selectedIndex) ? search.selectedIndex : -1;
    const item = index >= 0 ? search.items?.[index] : null;
    if (!item) {
      setGameMessage(game, "没有可放入加密箱的物品");
      return true;
    }
    return secureSearchItem(game, item.uid);
  }

  function secureSearchItem(game, uid) {
    const search = game.__realismSearch;
    if (!search?.revealed || !uid) return false;
    const claimed = new Set(search.claimedUids || []);
    if (claimed.has(uid)) return true;
    const item = search.items?.find((entry) => entry.uid === uid);
    if (!item) return true;
    const state = getEconomyState();
    state.secureContainer = Array.isArray(state.secureContainer) ? state.secureContainer : [];
    if (state.secureContainer.length >= SECURE_CONTAINER_CAPACITY) {
      setGameMessage(game, "加密箱已满");
      return true;
    }
    const securedItem = { ...item, location: "secure" };
    state.inventory.push(securedItem);
    state.secureContainer.push(securedItem.uid);
    saveEconomyState(state);
    claimed.add(uid);
    search.claimedUids = [...claimed];
    const def = getMarketDefinition(item.defId);
    const itemIndex = (search.items || []).findIndex((entry) => entry?.uid === uid);
    selectNextSearchItem(search, itemIndex);
    setGameMessage(game, `已放入加密箱：${def?.name || "物资"}`);
    finishSearchIfEmpty(game);
    markDeltaUiDirty();
    return true;
  }

  function claimAllSearchItems(game) {
    const search = game.__realismSearch;
    if (!search?.revealed) return;
    const claimed = new Set(search.claimedUids || []);
    const freeSlots = getBackpackFreeSlots();
    if (freeSlots <= 0) {
      setGameMessage(game, "背包已满，先撤离或清理变卖物");
      return;
    }
    const freshItems = (search.items || []).filter((item) => item && !claimed.has(item.uid)).slice(0, freeSlots);
    if (!freshItems.length) {
      finishSearchIfEmpty(game);
      return;
    }
    const state = getEconomyState();
    state.inventory.push(...freshItems.map((item) => ({ ...item, location: "backpack" })));
    saveEconomyState(state);
    for (const item of freshItems) claimed.add(item.uid);
    search.claimedUids = [...claimed];
    const names = freshItems.map((item) => getMarketDefinition(item.defId)?.name).filter(Boolean).join("、");
    const left = (search.items || []).filter((item) => item && !claimed.has(item.uid)).length;
    setGameMessage(game, left ? `获得：${names || "物资"}，背包已满` : `获得：${names || "物资"}`);
    finishSearchIfEmpty(game);
    markDeltaUiDirty();
  }

  function finishSearchIfEmpty(game) {
    const search = game.__realismSearch;
    if (!search) return;
    const claimed = new Set(search.claimedUids || []);
    const allClaimed = (search.items || []).every((item) => item && claimed.has(item.uid));
    if (!allClaimed) return;
    search.container.userData.searched = true;
    search.container.userData.searchCache = null;
    markSearchedContainer(search.container);
    game.__realismSearch = null;
    markDeltaUiDirty();
  }

  function closeSearchInterface(game) {
    const search = game.__realismSearch;
    if (!search) return;
    const claimed = new Set(search.claimedUids || []);
    const remaining = (search.items || []).filter((item) => item && !claimed.has(item.uid));
    if (remaining.length) {
      search.container.userData.searched = false;
      search.container.userData.searchCache = {
        items: search.items || [],
        claimedUids: [...claimed],
        revealed: !!search.revealed,
        label: search.label || `搜索 ${search.container.userData?.label || "容器"}`
      };
    } else if (search.revealed) {
      search.container.userData.searched = true;
      search.container.userData.searchCache = null;
      markSearchedContainer(search.container);
    }
    game.__realismSearch = null;
    setGameMessage(game, remaining.length ? "已关闭，可靠近按 N 重新打开" : "已关闭搜索界面");
    markDeltaUiDirty();
  }

  function reopenSearchContainer(game, container) {
    const cache = container?.userData?.searchCache;
    if (!cache?.items?.length) return false;
    const now = Number(game.now || 0);
    const duration = Math.max(0.5, ...cache.items.map((item) => getMarketDefinition(item.defId)?.scanTime || 0.5));
    game.__realismSearch = {
      container,
      items: cache.items,
      claimedUids: cache.claimedUids || [],
      revealed: !!cache.revealed,
      selectedIndex: -1,
      label: cache.label || `搜索 ${container.userData?.label || "容器"}`,
      startedAt: now,
      doneAt: now + (cache.revealed ? 0.5 : duration)
    };
    setGameMessage(game, `重新打开 ${container.userData?.label || "容器"}`);
    return true;
  }

  function reopenNearestClosedContainer(game) {
    if (!game?.session || game.session.screen !== "playing") {
      setGameMessage(game, "进入地图后才能重新打开容器");
      return;
    }
    const container = findNearestClosedSearchContainer(game);
    if (!container) {
      setGameMessage(game, "附近没有可重开的容器，按 L 搜索新容器");
      return;
    }
    reopenSearchContainer(game, container);
  }

  function findNearestClosedSearchContainer(game) {
    const player = game.player?.getPosition?.() || game.camera?.position;
    const containers = game.arena?.group?.__realismLootContainers || [];
    if (!player || !containers.length) return null;
    let best = null;
    let bestDistance = Infinity;
    for (const container of containers) {
      if (container.userData?.searched || !container.userData?.searchCache) continue;
      const distance = Math.hypot((player.x || 0) - (container.position.x || 0), (player.z || 0) - (container.position.z || 0));
      if (distance < bestDistance) {
        best = container;
        bestDistance = distance;
      }
    }
    return bestDistance <= SEARCH_INTERACT_DISTANCE ? best : null;
  }

  function normalizeSearchSelection(search) {
    if (!search) return;
    const indexes = getSearchSelectableIndexes(search);
    if (!indexes.length) {
      search.selectedIndex = -1;
      return;
    }
    if (!indexes.includes(search.selectedIndex)) search.selectedIndex = indexes[0];
  }

  function getSearchSelectableIndexes(search) {
    const claimed = new Set(search.claimedUids || []);
    return (search.items || [])
      .map((item, index) => (item && !claimed.has(item.uid) ? index : -1))
      .filter((index) => index >= 0);
  }

  function selectNextSearchItem(search, fromIndex = -1) {
    const indexes = getSearchSelectableIndexes(search);
    if (!indexes.length) {
      search.selectedIndex = -1;
      return;
    }
    search.selectedIndex = indexes.find((index) => index > fromIndex) ?? indexes[0];
  }

  function moveSearchSelection(game, key) {
    const search = game.__realismSearch;
    if (!search?.revealed) return false;
    const indexes = getSearchSelectableIndexes(search);
    if (!indexes.length) {
      search.selectedIndex = -1;
      setGameMessage(game, "没有可拾取物品");
      return true;
    }
    normalizeSearchSelection(search);
    const slotCount = Math.max(SEARCH_GRID_SLOTS, Math.ceil((search.items || []).length / 3) * 3);
    const columns = 3;
    const step = key === "ArrowLeft" ? -1 : key === "ArrowRight" ? 1 : key === "ArrowUp" ? -columns : columns;
    const current = Number.isFinite(search.selectedIndex) ? search.selectedIndex : indexes[0];
    const selectable = new Set(indexes);
    let target = current;
    for (let attempt = 0; attempt < slotCount; attempt += 1) {
      target = (target + step + slotCount) % slotCount;
      if (selectable.has(target)) {
        search.selectedIndex = target;
        announceSelectedSearchItem(game, search);
        return true;
      }
    }
    const pos = Math.max(0, indexes.indexOf(current));
    const fallback = key === "ArrowLeft" || key === "ArrowUp" ? indexes[(pos - 1 + indexes.length) % indexes.length] : indexes[(pos + 1) % indexes.length];
    search.selectedIndex = fallback;
    announceSelectedSearchItem(game, search);
    return true;
  }

  function announceSelectedSearchItem(game, search) {
    const item = search.items?.[search.selectedIndex];
    const def = getMarketDefinition(item?.defId);
    if (def) setGameMessage(game, `选中：${def.name}`);
  }

  function findNearestLootContainer(game) {
    const player = game.player?.getPosition?.() || game.camera?.position;
    const containers = game.arena?.group?.__realismLootContainers || [];
    if (!player || !containers.length) return null;
    let best = null;
    let bestDistance = Infinity;
    for (const container of containers) {
      if (container.userData?.searched) continue;
      const distance = Math.hypot((player.x || 0) - (container.position.x || 0), (player.z || 0) - (container.position.z || 0));
      if (distance < bestDistance) {
        best = container;
        bestDistance = distance;
      }
    }
    return bestDistance <= SEARCH_INTERACT_DISTANCE ? best : null;
  }

  function generateContainerLoot(container) {
    const count = 3 + Math.floor(Math.random() * 4);
    const items = [];
    for (let i = 0; i < count; i += 1) {
      const def = pickSellableDefinition(container.userData?.lootBias || 0);
      items.push(createInventoryItem(def));
    }
    return items;
  }

  function pickSellableDefinition(bias = 0) {
    const roll = Math.random() + bias;
    const tier = roll > 0.985 ? "red" : roll > 0.86 ? "gold" : roll > 0.58 ? "blue" : roll > 0.28 ? "green" : "white";
    const choices = SELLABLE_DEFS.filter((item) => item.tier === tier);
    return choices[Math.floor(Math.random() * choices.length)] || SELLABLE_DEFS[0];
  }

  function markSearchedContainer(container) {
    container.traverse?.((child) => {
      if (child.isMesh && child.material?.opacity !== undefined) {
        child.material = child.material.clone?.() || child.material;
        child.material.transparent = true;
        child.material.opacity = 0.42;
      }
    });
  }

  function installInventoryKeyControls(game) {
    if (game.__realismInventoryKeysInstalled) return;
    game.__realismInventoryKeysInstalled = true;
    window.addEventListener("keydown", (event) => {
      if (event.repeat || isTextInputEvent(event)) return;
      const key = event.key?.toLowerCase();
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key) && game.__realismSearch) {
        moveSearchSelection(game, event.key);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key) && game.__realismLoadoutOpen) {
        moveBackpackSelection(game, event.key);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "m" && game.__realismSearch) {
        claimSelectedSearchItem(game);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "b" && game.__realismSearch) {
        secureSelectedSearchItem(game);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "m" && game.__realismLoadoutOpen) {
        discardSelectedBackpackItem(game);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "b" && game.__realismLoadoutOpen) {
        secureSelectedBackpackItem(game);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "n" && game.__realismSearch) {
        closeSearchInterface(game);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if ((key === "v" || key === "n" || event.key === "Escape") && game.__realismLoadoutOpen) {
        game.__realismLoadoutOpen = false;
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "v") {
        toggleLoadoutPanel(game);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "n") {
        reopenNearestClosedContainer(game);
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "q") {
        useHealthRecovery(game);
        event.preventDefault();
      }
      if (key === "x") {
        useSwiftInjector(game);
        event.preventDefault();
      }
      if (key === "g") {
        throwTacticalItem(game, "grenade");
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "h") {
        throwTacticalItem(game, "flash");
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (key === "l") {
        searchNearestContainer(game);
        event.preventDefault();
      }
    });
  }

  function throwTacticalItem(game, effect) {
    const T = window.__FPS_THREE__;
    if (!game?.camera || !T?.Vector3 || game.session?.screen !== "playing") {
      setGameMessage(game, "进局后才能投掷战术道具");
      return;
    }
    const state = getEconomyState();
    const index = findTacticalItemIndex(state, effect);
    if (index < 0) {
      setGameMessage(game, effect === "grenade" ? "仓库里没有可用手雷" : "仓库里没有可用闪光弹");
      return;
    }
    const item = state.inventory[index];
    const def = getMarketDefinition(item.defId);
    state.inventory.splice(index, 1);
    saveEconomyState(state);
    markDeltaUiDirty();
    createTacticalProjectile(game, T, def);
    setGameMessage(game, effect === "grenade" ? "已投掷破片手雷" : "已投掷闪光弹");
  }

  function findTacticalItemIndex(state, effect) {
    return (state.inventory || []).findIndex((item) => {
      if (isItemInSecureContainer(state, item.uid)) return false;
      const def = getMarketDefinition(item.defId);
      return def?.type === "tactical" && def.effect === effect;
    });
  }

  function createTacticalProjectile(game, T, def) {
    const mats = game.__realismMats;
    const origin = new T.Vector3();
    const direction = new T.Vector3();
    game.camera.getWorldPosition(origin);
    game.camera.getWorldDirection(direction);
    origin.addScaledVector(direction, 0.82);
    origin.y -= 0.16;

    const material = def.effect === "flash" ? mats.flashWhite : mats.fragMetal;
    const mesh = addCylinder(game.scene, T, origin.x, origin.y, origin.z, def.effect === "flash" ? 0.115 : 0.13, def.effect === "flash" ? 0.3 : 0.34, material, def.effect === "flash" ? "thrown-flashbang" : "thrown-frag-grenade", "z");
    const velocity = direction.clone().multiplyScalar(def.effect === "flash" ? 16 : 15.5);
    velocity.y += def.effect === "flash" ? 3.2 : 3.6;

    game.__realismTacticalProjectiles = game.__realismTacticalProjectiles || [];
    game.__realismTacticalProjectiles.push({
      type: def.effect,
      defId: def.id,
      mesh,
      velocity,
      radius: def.radius || 5,
      damage: def.damage || 0,
      duration: def.duration || 3,
      fuse: def.effect === "flash" ? 1.15 : 1.75,
      thrownAt: performance.now() / 1000,
      bounced: false
    });
  }

  function updateTacticalProjectiles(game, T) {
    const projectiles = game.__realismTacticalProjectiles || [];
    if (!projectiles.length) return;
    const now = performance.now() / 1000;
    const last = Number(game.__realismTacticalLastAt || now);
    const dt = Math.max(0.001, Math.min(0.05, now - last || 0.016));
    game.__realismTacticalLastAt = now;
    const keep = [];

    for (const projectile of projectiles) {
      if (!projectile.mesh?.parent) continue;
      projectile.velocity.y -= 9.4 * dt;
      projectile.mesh.position.addScaledVector(projectile.velocity, dt);
      projectile.mesh.rotation.x += dt * 8.5;
      projectile.mesh.rotation.z += dt * 5.8;

      const hitTarget = projectile.type === "flash" ? findFlashHitTarget(game, projectile.mesh.position) : null;
      if (hitTarget) {
        detonateFlashProjectile(game, T, projectile, hitTarget);
        continue;
      }

      const hitCollider = isProjectileInsideCollider(game.arena, projectile.mesh.position);
      const hitGround = projectile.mesh.position.y <= 0.14;
      if (hitGround && !projectile.bounced && performance.now() / 1000 - projectile.thrownAt < projectile.fuse - 0.2) {
        projectile.mesh.position.y = 0.14;
        projectile.velocity.y = Math.abs(projectile.velocity.y) * 0.34;
        projectile.velocity.x *= 0.68;
        projectile.velocity.z *= 0.68;
        projectile.bounced = true;
      }

      if (now - projectile.thrownAt >= projectile.fuse || hitCollider || (hitGround && projectile.bounced && Math.abs(projectile.velocity.y) < 0.65)) {
        if (projectile.type === "grenade") detonateGrenadeProjectile(game, T, projectile);
        else detonateFlashProjectile(game, T, projectile, null);
        continue;
      }
      keep.push(projectile);
    }
    game.__realismTacticalProjectiles = keep;
  }

  function isProjectileInsideCollider(arena, position) {
    if (!arena?.colliders) return false;
    return arena.colliders.some((collider) =>
      position.x >= collider.minX && position.x <= collider.maxX &&
      position.z >= collider.minZ && position.z <= collider.maxZ &&
      position.y >= collider.minY + 0.1 && position.y <= collider.maxY - 0.05
    );
  }

  function detonateGrenadeProjectile(game, T, projectile) {
    const point = projectile.mesh.position.clone();
    removeProjectileMesh(projectile);
    createBlastEffect(game, T, point, projectile.radius, "grenade");
    damageDestructibleBuildings(game, T, point, projectile.radius);
    damageUnitsInBlast(game, point, projectile.radius, projectile.damage || 34);
  }

  function detonateFlashProjectile(game, T, projectile, targetRecord) {
    const point = projectile.mesh.position.clone();
    removeProjectileMesh(projectile);
    createBlastEffect(game, T, point, projectile.radius, "flash");
    const duration = projectile.duration || 3;
    if (targetRecord) {
      targetRecord.enemy = { ...targetRecord.enemy, hitFlash: 1, state: "flashed" };
      targetRecord.__realismFlashUntil = Number(game.now || 0) + duration;
      targetRecord.view?.sync?.(targetRecord.enemy, game.player?.getPosition?.());
      if (targetRecord.isLanRemote || targetRecord.enemy?.isHuman) {
        sendLanFlash(game, targetRecord.enemy?.id, point, duration);
      }
      setGameMessage(game, "闪光弹命中对手");
    }
    const playerPosition = getPlayerWorldPosition(game, window.__FPS_THREE__);
    if (playerPosition && distance3(playerPosition, point) <= projectile.radius * 0.72) {
      triggerFlashOverlay(game, duration);
      setGameMessage(game, "你被闪光弹影响");
    }
  }

  function removeProjectileMesh(projectile) {
    const mesh = projectile?.mesh;
    if (!mesh) return;
    mesh.parent?.remove(mesh);
    mesh.geometry?.dispose?.();
  }

  function createBlastEffect(game, T, point, radius, kind) {
    if (!game?.scene) return;
    const mats = game.__realismMats;
    if (kind === "grenade" && typeof game.createExplosionEffect === "function") {
      try {
        game.createExplosionEffect(point, Math.min(radius, 7));
      } catch {
        // The fallback effect below still shows the blast.
      }
    }
    const flash = addSphere(game.scene, T, point.x, Math.max(0.2, point.y), point.z, kind === "flash" ? 0.42 : 0.34, kind === "flash" ? mats.flashWhite : mats.blastGlow, kind === "flash" ? "flashbang-burst" : "grenade-burst");
    flash.scale.setScalar(kind === "flash" ? 1.8 : 1.2);
    setTimeout(() => {
      flash.parent?.remove(flash);
      flash.geometry?.dispose?.();
    }, kind === "flash" ? 520 : 460);
    if (kind === "grenade") {
      for (let i = 0; i < 8; i += 1) {
        const angle = (i / 8) * Math.PI * 2;
        const dust = addSphere(game.scene, T, point.x + Math.cos(angle) * 0.8, 0.2, point.z + Math.sin(angle) * 0.8, 0.18 + Math.random() * 0.16, mats.dustCloud, "blast-dust-cloud");
        dust.scale.set(1.8, 0.55, 1.8);
        setTimeout(() => {
          dust.parent?.remove(dust);
          dust.geometry?.dispose?.();
        }, 900 + i * 35);
      }
    }
  }

  function findFlashHitTarget(game, position) {
    const playerTeam = game.session?.playerTeam || game.lanClient?.team || "blue";
    let best = null;
    let bestDistance = Infinity;
    for (const record of game.enemyRecords || []) {
      const enemy = record.enemy;
      if (!enemy || enemy.dead || enemy.team === playerTeam) continue;
      const enemyPosition = getEnemyWorldPosition(record);
      if (!enemyPosition) continue;
      const distance = distance3({ x: position.x, y: position.y, z: position.z }, { x: enemyPosition.x, y: enemyPosition.y + 1.0, z: enemyPosition.z });
      if (distance < bestDistance) {
        best = record;
        bestDistance = distance;
      }
    }
    return bestDistance <= 1.25 ? best : null;
  }

  function damageUnitsInBlast(game, point, radius, damage) {
    const playerPosition = getPlayerWorldPosition(game, window.__FPS_THREE__);
    if (playerPosition) {
      const playerDistance = distance3(playerPosition, point);
      if (playerDistance <= radius * 0.88) {
        const amount = Math.max(4, damage * (1 - playerDistance / radius) * 0.72);
        applyDirectPlayerDamage(game, amount, "爆炸冲击");
      }
    }
    const playerTeam = game.session?.playerTeam || game.lanClient?.team || "blue";
    for (const record of game.enemyRecords || []) {
      if (record.isLanRemote || record.enemy?.dead || record.enemy?.team === playerTeam) continue;
      const enemyPosition = getEnemyWorldPosition(record);
      if (!enemyPosition) continue;
      const enemyPoint = { x: enemyPosition.x, y: enemyPosition.y + 0.9, z: enemyPosition.z };
      const enemyDistance = distance3(enemyPoint, point);
      if (enemyDistance > radius) continue;
      const amount = Math.max(6, damage * (1 - enemyDistance / radius));
      applyDirectEnemyDamage(game, record, amount, "手雷爆炸");
    }
  }

  function damageDestructibleBuildings(game, T, point, radius) {
    const arena = game.arena;
    const root = arena?.group;
    if (!root) return;
    const impacted = [];
    root.traverse((child) => {
      if (!child.isMesh || child.__realismDestroyed || !isDestructibleBuildingMesh(child)) return;
      const size = getBoxMeshSize(child);
      const center = child.position;
      const distance = Math.hypot(center.x - point.x, center.z - point.z) + Math.max(0, Math.abs(center.y - point.y) - size.y * 0.45) * 0.35;
      if (distance <= radius + Math.max(size.x, size.z) * 0.22) impacted.push({ mesh: child, distance });
    });
    impacted.sort((a, b) => a.distance - b.distance);
    for (const hit of impacted.slice(0, 18)) breakBuildingMesh(game, T, hit.mesh, point);

    const shops = root.__realismDestructibleBuildings || [];
    for (const shop of shops) {
      const distance = Math.hypot(shop.x - point.x, shop.z - point.z);
      if (distance <= radius + 2.2 && point.y <= 2.4) shop.baseHits += distance < 4.5 ? 2 : 1;
      if (!shop.collapsed && shop.baseHits >= 2) collapseShop(game, T, shop, point);
    }
  }

  function isDestructibleBuildingMesh(mesh) {
    const name = String(mesh.name || "");
    if (name.includes("interactive-shop-door")) return true;
    return (
      name.includes("street-shop") ||
      name.includes("shop-entry-inner-wall") ||
      name.includes("shop-shelf-frame") ||
      name.includes("shop-counter")
    ) && !name.includes("interior-floor");
  }

  function breakBuildingMesh(game, T, mesh, blastPoint) {
    if (!mesh?.parent || mesh.__realismDestroyed) return;
    mesh.__realismDestroyed = true;
    const pos = mesh.position.clone ? mesh.position.clone() : new T.Vector3(mesh.position.x || 0, mesh.position.y || 0, mesh.position.z || 0);
    const size = getBoxMeshSize(mesh);
