  function softenBlockEdges(root, mesh, T, mats) {
    if (mesh.__realismSoftEdgesDone) return;
    mesh.__realismSoftEdgesDone = true;
    const params = mesh.geometry?.parameters || {};
    const w = (params.width || 0) * (mesh.scale?.x || 1);
    const h = (params.height || 0) * (mesh.scale?.y || 1);
    const d = (params.depth || 0) * (mesh.scale?.z || 1);
    if (h < 0.45 || Math.max(w, d) < 3 || mesh.name === "boundary-wall") return;
    const radius = Math.min(0.08, h * 0.08);
    const mat = mesh.material || mats.concrete;
    if (w >= d) {
      addCylinder(root, T, mesh.position.x, mesh.position.y + h / 2 + radius * 0.2, mesh.position.z - d / 2, radius, w, mat, "rounded-cover-edge", "x");
      addCylinder(root, T, mesh.position.x, mesh.position.y + h / 2 + radius * 0.2, mesh.position.z + d / 2, radius, w, mat, "rounded-cover-edge", "x");
    } else {
      addCylinder(root, T, mesh.position.x - w / 2, mesh.position.y + h / 2 + radius * 0.2, mesh.position.z, radius, d, mat, "rounded-cover-edge", "z");
      addCylinder(root, T, mesh.position.x + w / 2, mesh.position.y + h / 2 + radius * 0.2, mesh.position.z, radius, d, mat, "rounded-cover-edge", "z");
    }
  }

  function addTree(root, T, mats, x, z) {
    addCylinder(root, T, x, 1.05, z, 0.18, 2.1, mats.trunk, "tree-trunk", "y");
    const crown = addSphere(root, T, x, 2.35, z, 1.05, mats.leaf, "tree-crown");
    crown.scale.set(1.25, 0.9, 1.1);
    addSphere(root, T, x - 0.55, 2.05, z + 0.22, 0.7, mats.leaf, "tree-crown-side");
    addSphere(root, T, x + 0.5, 2.1, z - 0.18, 0.72, mats.leaf, "tree-crown-side");
  }

  function addPlanter(root, T, mats, x, z, w, d) {
    addBox(root, T, x, 0.28, z, w, 0.56, d, mats.concrete, "concrete-planter");
    addBox(root, T, x, 0.6, z, w - 0.45, 0.16, d - 0.45, mats.dirt, "planter-soil");
    for (let i = 0; i < Math.max(4, Math.floor(w / 2)); i += 1) {
      const px = x - w / 2 + 1 + i * 1.55;
      addSphere(root, T, px, 0.9, z, 0.42, mats.leaf, "planter-shrub").scale.set(1, 0.55, 0.85);
    }
  }

  function addClimbableBlock(arena, T, x, z, w, h, d, material, name) {
    const mesh = addBox(arena.group, T, x, h / 2, z, w, h, d, material, name);
    arena.meshes.push(mesh);
    addStaticCollider(arena, name, x, z, w, h, d, { climbable: true });
    return mesh;
  }

  function addSolidCoverBlock(arena, T, x, z, w, h, d, material, name) {
    const mesh = addBox(arena.group, T, x, h / 2, z, w, h, d, material, name);
    arena.meshes.push(mesh);
    addStaticCollider(arena, name, x, z, w, h, d);
    return mesh;
  }

  function addStaticCollider(arena, name, x, z, w, h, d, options = {}) {
    if (!arena?.colliders) return;
    arena.colliders.push({
      name,
      minX: x - w / 2,
      maxX: x + w / 2,
      minY: 0,
      maxY: h,
      minZ: z - d / 2,
      maxZ: z + d / 2,
      climbable: !!options.climbable,
      ladder: false
    });
  }

  function addBarrel(arena, T, mats, x, z) {
    const mesh = new T.Mesh(new T.CylinderGeometry(0.48, 0.48, 1.1, 24), mats.metal);
    mesh.name = "detail-cover";
    mesh.position.set(x, 0.55, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    arena.group.add(mesh);
    arena.meshes.push(mesh);
    arena.colliders.push({
      name: "detail-cover",
      minX: x - 0.48,
      maxX: x + 0.48,
      minY: 0,
      maxY: 1.1,
      minZ: z - 0.48,
      maxZ: z + 0.48,
      climbable: false,
      ladder: false
    });
    addBox(mesh, T, 0, 0.28, 0, 1.02, 0.08, 1.02, mats.darkMetal, "barrel-band");
    addBox(mesh, T, 0, -0.28, 0, 1.02, 0.08, 1.02, mats.darkMetal, "barrel-band");
  }

  function addPallet(root, T, mats, x, z) {
    for (let i = -1; i <= 1; i += 1) addBox(root, T, x + i * 0.62, 0.15, z, 0.42, 0.28, 2.2, mats.canvas, "wooden-pallet");
    addBox(root, T, x, 0.36, z - 0.68, 2.4, 0.16, 0.28, mats.dirt, "wooden-pallet-slat");
    addBox(root, T, x, 0.36, z + 0.68, 2.4, 0.16, 0.28, mats.dirt, "wooden-pallet-slat");
  }

  function addSandbags(root, T, mats, x, y, z, w, d, axis) {
    const count = Math.max(3, Math.floor((axis === "x" ? w : d) / 1.15));
    for (let i = 0; i < count; i += 1) {
      const offset = (i - (count - 1) / 2) * 1.08;
      const bag = new T.Mesh(new T.CylinderGeometry(0.28, 0.32, 0.92, 12), mats.sandbag);
      bag.name = "realistic-sandbag";
      bag.position.set(x + (axis === "x" ? offset : 0), y, z + (axis === "z" ? offset : 0));
      if (axis === "x") bag.rotation.z = Math.PI / 2;
      else bag.rotation.x = Math.PI / 2;
      bag.castShadow = true;
      bag.receiveShadow = true;
      root.add(bag);
    }
  }

  function upgradeCharacters(game, T) {
    for (const record of game.enemyRecords || []) {
      const root = record.view?.root;
      if (!root || root.__realismCharacterDone) continue;
      root.__realismCharacterDone = true;
      dressCharacter(root, T, record.enemy || {}, game.__realismMats);
    }
    for (const dummy of game.targetDummies || []) {
      const root = dummy.root;
      if (!root || root.__realismCharacterDone) continue;
      root.__realismCharacterDone = true;
      dressDummy(root, T, game.__realismMats);
    }
  }

  function dressCharacter(root, T, enemy, mats) {
    const seed = hashCode(enemy.id || enemy.name || "unit");
    const uniform = UNIFORMS[Math.abs(seed) % UNIFORMS.length];
    const skin = SKIN[Math.abs(seed >> 3) % SKIN.length];
    const teamColor = TEAM_PATCH[enemy.team] || 0xdddddd;
    const cloth = new T.MeshStandardMaterial({ color: uniform.cloth, roughness: 0.9, metalness: 0.01 });
    const vest = new T.MeshStandardMaterial({ color: uniform.vest, roughness: 0.82, metalness: 0.04 });
    const accent = new T.MeshStandardMaterial({ color: uniform.accent, roughness: 0.86, metalness: 0.02 });
    const skinMat = new T.MeshStandardMaterial({ color: skin, roughness: 0.72, metalness: 0.0 });
    const patch = new T.MeshStandardMaterial({ color: teamColor, roughness: 0.55, metalness: 0.0 });

    root.traverse((child) => {
      if (!child.isMesh) return;
      const y = child.position?.y || 0;
      child.material = y > 1.1 ? cloth : vest;
      child.castShadow = true;
      child.receiveShadow = true;
      if (child.name?.includes("plate") || child.name?.includes("carrier") || child.name?.includes("backpack")) child.scale.multiplyScalar(0.82);
    });

    addSphere(root, T, 0, 1.48, 0, 0.28, skinMat, "realistic-head").scale.set(0.82, 1, 0.78);
    addSphere(root, T, 0, 1.66, 0, 0.31, new T.MeshStandardMaterial({ color: uniform.helmet, roughness: 0.8, metalness: 0.05 }), "tactical-helmet").scale.set(1.0, 0.52, 0.86);
    addBox(root, T, 0, 1.49, -0.23, 0.34, 0.09, 0.045, mats.glass, "helmet-visor");
    addBox(root, T, 0, 0.98, -0.28, 0.46, 0.5, 0.12, vest, "slim-plate-carrier");
    addBox(root, T, 0, 0.98, 0.24, 0.38, 0.56, 0.12, mats.canvas, "slim-field-backpack");
    addBox(root, T, -0.38, 1.08, -0.02, 0.18, 0.52, 0.18, cloth, "left-arm-soft");
    addBox(root, T, 0.38, 1.08, -0.02, 0.18, 0.52, 0.18, cloth, "right-arm-soft");
    addBox(root, T, -0.18, 0.42, -0.02, 0.18, 0.64, 0.18, cloth, "left-leg-soft");
    addBox(root, T, 0.18, 0.42, -0.02, 0.18, 0.64, 0.18, cloth, "right-leg-soft");
    addBox(root, T, -0.21, 0.14, -0.05, 0.24, 0.16, 0.36, mats.rubber, "left-boot");
    addBox(root, T, 0.21, 0.14, -0.05, 0.24, 0.16, 0.36, mats.rubber, "right-boot");
    addBox(root, T, -0.16, 1.25, -0.38, 0.18, 0.12, 0.045, patch, "team-patch-a");
    addBox(root, T, 0.16, 1.25, -0.38, 0.18, 0.12, 0.045, patch, "team-patch-b");
    addBox(root, T, -0.22, 0.88, -0.36, 0.14, 0.22, 0.06, accent, "mag-pouch-a");
    addBox(root, T, 0, 0.88, -0.37, 0.14, 0.22, 0.06, accent, "mag-pouch-b");
    addBox(root, T, 0.22, 0.88, -0.36, 0.14, 0.22, 0.06, accent, "mag-pouch-c");

    const height = 0.96 + (Math.abs(seed) % 9) / 100;
    root.scale.y *= height;
    root.scale.x *= 0.96 + (Math.abs(seed >> 4) % 8) / 100;
  }

  function dressDummy(root, T, mats) {
    root.traverse((child) => {
      if (child.isMesh) {
        child.material = mats.canvas;
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    addBox(root, T, 0, 1.05, -0.2, 0.62, 0.72, 0.08, mats.sandbag, "dummy-fabric-front");
    addBox(root, T, 0, 0.58, -0.22, 0.38, 0.18, 0.08, mats.darkMetal, "dummy-stand-brace");
  }

  function makeWeaponLessToyLike(game, T) {
    const weapon = game.weaponModel;
    const attachmentState = getWeaponAttachmentState();
    const sightMode = attachmentState.optic?.scopeType === "4x" ? "4x" : attachmentState.optic ? "reflex" : "bare";
    const attachmentKey = attachmentState.attachments.map((item) => item.id).sort().join(",") || "bare";
    const weaponKey = `${VERSION}:${sightMode}:${getEquippedWeaponDef()?.id || "base"}:${attachmentKey}`;
    if (!weapon || weapon.__realismWeaponDone === weaponKey) return;
    clearRealismWeaponAddons(weapon);
    weapon.__realismWeaponDone = weaponKey;
    const mats = game.__realismMats;
    weapon.traverse((child) => {
      if (child.isMesh) {
        child.material = mats.darkMetal;
        child.castShadow = true;
        if (["optic", "scope-tube", "scope-lens-front", "scope-lens-rear", "optic-body", "optic-glass"].some((part) => child.name?.includes(part))) {
          child.visible = false;
        }
      }
    });
    addCylinder(weapon, T, 0.42, -0.32, -1.46, 0.045, 0.9, mats.darkMetal, "round-barrel", "z");
    if (sightMode === "4x") addFourPowerScope(weapon, T, mats);
    else if (sightMode === "reflex") addFramelessReflexSight(weapon, T, mats);
    if (attachmentState.muzzle) addCylinder(weapon, T, 0.42, -0.32, -1.93, 0.075, 0.24, mats.metal, "muzzle-device-round", "z");
    if (attachmentState.grip) addCylinder(weapon, T, 0.42, -0.54, -1.02, 0.07, 0.34, mats.rubber, "foregrip-round", "y");
    addBox(weapon, T, 0.42, -0.17, -0.98, 0.34, 0.035, 0.9, mats.metal, "continuous-picatinny-rail");
    for (let i = 0; i < 7; i += 1) addBox(weapon, T, 0.42, -0.135, -1.34 + i * 0.11, 0.28, 0.035, 0.035, mats.darkMetal, "rail-tooth");
    if (attachmentState.laser) {
      addBox(weapon, T, 0.18, -0.29, -1.22, 0.08, 0.11, 0.32, mats.darkMetal, "side-laser-module");
      addBox(weapon, T, 0.17, -0.29, -1.43, 0.045, 0.045, 0.045, mats.warmLight, "laser-lens");
    }
    const magHeight = attachmentState.mag ? 0.5 : 0.38;
    const magName = attachmentState.mag ? "extended-magazine" : "slim-magazine";
    addBox(weapon, T, 0.42, -0.56, -0.58, 0.14, magHeight, 0.14, mats.darkMetal, magName);
    addBox(weapon, T, 0.55, -0.29, -0.72, 0.035, 0.2, 0.42, mats.metal, "ejection-port-detail");
    addBox(weapon, T, 0.42, -0.39, -1.08, 0.25, 0.12, 0.44, mats.rubber, "angled-handguard-pad");
    if (attachmentState.stock) addBox(weapon, T, 0.42, -0.22, -0.14, 0.26, 0.12, 0.26, mats.rubber, "tactical-stock-addon");
  }

  function clearRealismWeaponAddons(weapon) {
    const remove = [];
    weapon.traverse((child) => {
      const name = child.name || "";
      if (
        name.includes("reflex") ||
        name.includes("red-dot") ||
        name.includes("four-x") ||
        name.includes("scope-ring") ||
        name.includes("open-frame-sight") ||
        name.includes("low-reflex-sight-base") ||
        name.includes("frameless-reflex-glass") ||
        name.includes("round-barrel") ||
        name.includes("muzzle-device-round") ||
        name.includes("suppressor-round") ||
        name.includes("foregrip-round") ||
        name.includes("continuous-picatinny-rail") ||
        name.includes("rail-tooth") ||
        name.includes("side-laser-module") ||
        name.includes("laser-lens") ||
        name.includes("slim-magazine") ||
        name.includes("extended-magazine") ||
        name.includes("ejection-port-detail") ||
        name.includes("angled-handguard-pad") ||
        name.includes("foregrip-rubber") ||
        name.includes("tactical-stock-addon")
      ) {
        remove.push(child);
      }
    });
    for (const child of remove) {
      child.parent?.remove(child);
      child.geometry?.dispose?.();
      if (Array.isArray(child.material)) for (const mat of child.material) mat.dispose?.();
      else child.material?.dispose?.();
    }
  }

  function addFramelessReflexSight(root, T, mats) {
    addBox(root, T, 0.42, -0.13, -0.72, 0.19, 0.035, 0.24, mats.darkMetal, "low-reflex-sight-base");
    const glass = addBox(root, T, 0.42, -0.048, -0.73, 0.24, 0.17, 0.018, mats.opticGlass, "frameless-reflex-glass");
    glass.rotation.x = -0.045;
    addBox(root, T, 0.285, -0.045, -0.725, 0.035, 0.2, 0.035, mats.darkMetal, "open-frame-sight-left");
    addBox(root, T, 0.555, -0.045, -0.725, 0.035, 0.2, 0.035, mats.darkMetal, "open-frame-sight-right");
    addBox(root, T, 0.42, 0.055, -0.725, 0.25, 0.025, 0.035, mats.darkMetal, "open-frame-sight-top");
    addSphere(root, T, 0.42, -0.013, -0.746, 0.01, mats.redDot, "red-dot-reticle");
  }

  function addFourPowerScope(root, T, mats) {
    addBox(root, T, 0.42, -0.14, -0.74, 0.2, 0.04, 0.56, mats.darkMetal, "four-x-scope-base");
    addCylinder(root, T, 0.42, -0.045, -0.75, 0.105, 0.72, mats.darkMetal, "four-x-scope-body", "z");
    addCylinder(root, T, 0.42, -0.045, -1.13, 0.13, 0.09, mats.metal, "four-x-scope-front-bell", "z");
    addCylinder(root, T, 0.42, -0.045, -0.37, 0.12, 0.08, mats.metal, "four-x-scope-rear-bell", "z");
    addCylinder(root, T, 0.42, -0.045, -0.94, 0.112, 0.035, mats.opticGlass, "four-x-scope-front-glass", "z");
    addCylinder(root, T, 0.42, -0.045, -0.51, 0.098, 0.03, mats.opticGlass, "four-x-scope-rear-glass", "z");
    addBox(root, T, 0.42, 0.066, -0.75, 0.16, 0.035, 0.035, mats.darkMetal, "four-x-scope-top-cap");
    addBox(root, T, 0.42, -0.045, -0.56, 0.24, 0.035, 0.035, mats.darkMetal, "scope-ring-rear");
    addBox(root, T, 0.42, -0.045, -0.98, 0.24, 0.035, 0.035, mats.darkMetal, "scope-ring-front");
  }

  function updateAlwaysOnLaser(game, T) {
    if (!game.camera || !game.__realismMats) return;
    const enabled = game.session?.screen === "playing" && !!getEquippedAttachmentBySlot("laser");
    let laser = game.camera.getObjectByName?.("always-on-purple-laser");
    let beam = game.camera.getObjectByName?.("always-on-purple-laser-beam");
    if (!enabled) {
      if (laser) laser.visible = false;
      if (beam) beam.visible = false;
      return;
    }
    if (!laser) {
      const points = [new T.Vector3(0.26, -0.34, -1.36), new T.Vector3(0.26, -0.34, -44)];
      const geometry = new T.BufferGeometry().setFromPoints(points);
      laser = new T.Line(geometry, game.__realismMats.purpleLaser);
      laser.name = "always-on-purple-laser";
      game.camera.add(laser);
    }
    if (!beam) {
      beam = addCylinder(game.camera, T, 0.26, -0.34, -22.5, 0.012, 42, game.__realismMats.purpleBeam, "always-on-purple-laser-beam", "z");
    }
    laser.visible = true;
    beam.visible = laser.visible;
    if (laser.material) laser.material.opacity = 0.68 + Math.sin((game.now || 0) * 9) * 0.12;
    if (beam.material) beam.material.opacity = 0.34 + Math.sin((game.now || 0) * 9) * 0.08;
  }

  function addBox(root, T, x, y, z, w, h, d, material, name) {
    const mesh = new T.Mesh(new T.BoxGeometry(w, h, d), material);
    mesh.name = name || "realism-box";
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    root.add(mesh);
    return mesh;
  }

  function addSphere(root, T, x, y, z, r, material, name) {
    const mesh = new T.Mesh(new T.SphereGeometry(r, 24, 14), material);
    mesh.name = name || "realism-sphere";
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    root.add(mesh);
    return mesh;
  }

  function addCylinder(root, T, x, y, z, radius, length, material, name, axis = "y") {
    const mesh = new T.Mesh(new T.CylinderGeometry(radius, radius, length, 24), material);
    mesh.name = name || "realism-cylinder";
    mesh.position.set(x, y, z);
    if (axis === "x") mesh.rotation.z = Math.PI / 2;
    if (axis === "z") mesh.rotation.x = Math.PI / 2;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    root.add(mesh);
    return mesh;
  }

  function addTextSign(root, T, text, x, y, z, rotationY) {
    if (!T.CanvasTexture || !T.SpriteMaterial || !T.Sprite) {
      addBox(root, T, x, y, z, 0.12, 0.8, 3.6, root.__fallbackSignMaterial || new T.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 }), "shop-sign-fallback");
      return;
    }
    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 128;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#f8fafc";
    ctx.font = "700 48px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 10;
    ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
    const texture = new T.CanvasTexture(canvas);
    const material = new T.SpriteMaterial({ map: texture, transparent: true });
    const sprite = new T.Sprite(material);
    sprite.name = `shop-sign-${text}`;
    sprite.position.set(x, y, z);
    sprite.rotation.y = rotationY;
    sprite.scale.set(4.6, 1.15, 1);
    root.add(sprite);
  }

  function hashCode(text) {
    let hash = 0;
    for (let i = 0; i < text.length; i += 1) hash = (hash * 31 + text.charCodeAt(i)) | 0;
    return hash;
  }
})();
</script>
