<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>仿三角洲</title>
  <link rel="stylesheet" href="./assets/game-30.css">
  <link rel="modulepreload" href="./assets/game-core-30.js">
  <link rel="preload" href="./assets/realism-53.js" as="script">
  <link rel="preload" href="./assets/scenery/dam-vista.avif" as="image" type="image/avif">
  <link rel="preload" href="./assets/operators/weicong.avif" as="image" type="image/avif">
  <style>
    #boot-loader{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;gap:16px;text-align:center;background:#080c0b;color:#f4f7f5;font:600 15px system-ui,sans-serif;transition:opacity .2s ease}
    #boot-loader.is-ready{opacity:0;pointer-events:none}
    #boot-loader span{width:42px;height:42px;margin:auto;border:3px solid #3c4843;border-top-color:#d8e8df;border-radius:50%;animation:boot-spin .7s linear infinite}
    @keyframes boot-spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot-loader" role="status" aria-live="polite"><span aria-hidden="true"></span><strong>正在进入行动区域</strong></div>
  <div id="app"></div>
  <script>
    (()=>{const loader=document.getElementById('boot-loader');const app=document.getElementById('app');const ready=()=>{if(!app.children.length)return;loader.classList.add('is-ready');setTimeout(()=>loader.remove(),240)};new MutationObserver(ready).observe(app,{childList:true});setTimeout(ready,0)})();
  </script>
  <script type="module" src="./assets/game-core-30.js"></script>
  <script defer src="./assets/realism-53.js"></script>
</body>
</html>
