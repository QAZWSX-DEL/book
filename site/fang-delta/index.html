<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="帕小葵的游戏库：选择并开始游玩浙大夜惊魂或仿三角洲。"
    />
    <meta name="theme-color" content="#f3c933" />
    <title>帕小葵的游戏库</title>
    <link rel="icon" href="./assets/pa-xiaokui-logo.png" />
    <link rel="preload" as="image" href="./assets/pa-xiaokui-logo.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top" aria-label="返回帕小葵的游戏库首页">
        <img src="./assets/pa-xiaokui-logo.png" alt="" />
        <span>帕小葵的游戏库</span>
      </a>
      <a class="topbar-link" href="#games">全部游戏</a>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-inner">
          <div class="hero-copy">
            <p class="eyebrow">PA XIAOKUI GAME LIBRARY</p>
            <h1 id="hero-title">帕小葵的游戏库</h1>
            <p class="hero-text">两个世界，随时开玩。</p>
            <a class="primary-button" href="#games">
              选择游戏
              <span aria-hidden="true">↓</span>
            </a>
          </div>
          <div class="mascot-stage" aria-hidden="true">
            <span class="mascot-disc"></span>
            <img src="./assets/pa-xiaokui-logo.png" alt="" />
          </div>
        </div>
      </section>

      <section class="games-section" id="games" aria-labelledby="games-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">GAME SELECT</p>
            <h2 id="games-title">选择游戏</h2>
          </div>
          <p>点击封面即可进入游戏</p>
        </div>

        <div class="game-grid">
          <a class="game-card game-card-campus" href="./game/">
            <img
              src="./assets/zju-haunting-cover.jpg"
              alt="夜色下的校园建筑和手持手电筒的调查者"
            />
            <span class="game-card-shade" aria-hidden="true"></span>
            <span class="game-card-content">
              <span class="game-number">01</span>
              <span class="game-kind">校园悬疑 · 探索解谜</span>
              <strong>浙大夜惊魂</strong>
              <span class="game-summary">走进雨夜校园，寻找线索，揭开被封存的秘密。</span>
              <span class="play-button">
                开始游戏
                <span aria-hidden="true">→</span>
              </span>
            </span>
          </a>

          <a class="game-card game-card-delta" href="./fang-delta/?v=55b">
            <img
              src="./assets/fang-delta-cover.jpg"
              alt="两名战术干员穿过受损的河畔街区"
            />
            <span class="game-card-shade" aria-hidden="true"></span>
            <span class="game-card-content">
              <span class="game-number">02</span>
              <span class="game-kind">战术行动 · 搜索撤离</span>
              <strong>仿三角洲</strong>
              <span class="game-summary">整备装备，进入战区搜索物资，并在倒计时结束前撤离。</span>
              <span class="play-button">
                开始游戏
                <span aria-hidden="true">→</span>
              </span>
            </span>
          </a>
        </div>
      </section>
    </main>

    <footer>
      <img src="./assets/pa-xiaokui-logo.png" alt="" />
      <span>帕小葵的游戏库</span>
    </footer>

    <script src="./main.js"></script>
  </body>
</html>
