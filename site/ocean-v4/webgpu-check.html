<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebGPU 自检</title>
<style>
  :root{ color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#071018; color:#e8f8ff; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
  main{ width:min(760px,100%); border:1px solid rgba(110,220,255,.22); border-radius:14px; padding:24px; background:rgba(10,18,26,.82); box-shadow:0 20px 80px rgba(0,0,0,.38); }
  h1{ margin:0 0 10px; font-size:20px; font-weight:650; letter-spacing:.08em; }
  p{ color:rgba(232,248,255,.72); line-height:1.8; margin:8px 0 18px; }
  pre{ white-space:pre-wrap; word-break:break-word; padding:14px; border-radius:10px; background:#02070b; color:#c7fff8; border:1px solid rgba(110,220,255,.18); font-size:12px; line-height:1.7; }
  canvas{ width:180px; height:120px; border-radius:10px; border:1px solid rgba(110,220,255,.2); background:#111; display:block; margin-top:14px; }
  a{ color:#9df4ff; }
</style>
</head>
<body>
<main>
  <h1>WebGPU 自检</h1>
  <p>这个页面不加载游戏，只检测 Safari / Chrome 是否能创建 WebGPU 适配器、设备和画布。如果这里失败，主游戏一定无法启动。</p>
  <pre id="out">正在检测...</pre>
  <canvas id="c" width="180" height="120"></canvas>
  <p><a href="./">返回游戏</a></p>
</main>
<script type="module">
const out = document.getElementById('out');
const lines = [];
const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };

log('UA: ' + navigator.userAgent);
log('isSecureContext: ' + window.isSecureContext);
log('navigator.gpu: ' + (navigator.gpu ? 'yes' : 'no'));

try {
  const canvas = document.getElementById('c');
  const context = canvas.getContext('webgpu');
  log("canvas.getContext('webgpu'): " + (context ? 'yes' : 'no'));
  if (!navigator.gpu) throw new Error('navigator.gpu is undefined');
  if (!context) throw new Error("canvas.getContext('webgpu') returned null");

  const adapter = await navigator.gpu.requestAdapter();
  log('requestAdapter: ' + (adapter ? 'ok' : 'null'));
  if (!adapter) throw new Error('requestAdapter returned null');

  const device = await adapter.requestDevice();
  log('requestDevice: ok');
  const format = navigator.gpu.getPreferredCanvasFormat();
  log('preferredCanvasFormat: ' + format);
  context.configure({ device, format, alphaMode: 'opaque' });
  const encoder = device.createCommandEncoder();
  const view = context.getCurrentTexture().createView();
  const pass = encoder.beginRenderPass({
    colorAttachments: [{
      view,
      clearValue: { r: 0.02, g: 0.42, b: 0.55, a: 1 },
      loadOp: 'clear',
      storeOp: 'store'
    }]
  });
  pass.end();
  device.queue.submit([encoder.finish()]);
  log('draw test: ok');
  log('结论: 这个浏览器可以创建基础 WebGPU。若主游戏仍失败,就是复杂 TSL 着色器或 Three.js WebGPU 路径在该浏览器上失败。');
} catch (err) {
  log('ERROR: ' + (err && (err.stack || err.message) || err));
  log('结论: 当前浏览器环境不能运行 WebGPU 游戏。请换桌面 Chrome / Edge 最新版,或在 Safari 设置/实验性功能里启用 WebGPU 后完全重启浏览器。');
}
</script>
</body>
</html>
